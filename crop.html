<script>
const $=s=>document.querySelector(s);
const file=$('#file'),drop=$('#drop'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),empty=$('#empty');
const overlay=$('#cropOverlay'),box=$('#cropBox');
const PAD=14;

let sourceImg=null;
let origName='image';
let sel={x:0,y:0,w:0,h:0};
let ratioNum=null;
let circle=false;
const sizePreset=$('#sizePreset');
let drag=null;

function num(el,fallback){
  if(!el||String(el.value).trim()==='')return fallback;
  const n=Number(el.value);
  return Number.isFinite(n)?n:fallback;
}
function parseRatio(key){
  if(!key||key==='free')return null;
  const parts=String(key).split('/');
  const a=Number(parts[0]),b=Number(parts[1]||1);
  if(!a||!b)return null;
  return a/b;
}
function currentAR(){
  if(circle)return 1;
  return ratioNum;
}
function clampSel(s){
  const iw=canvas.width||1,ih=canvas.height||1;
  let w=Math.round(Number(s.w)||1),h=Math.round(Number(s.h)||1);
  let x=Math.round(Number(s.x)||0),y=Math.round(Number(s.y)||0);
  w=Math.max(1,Math.min(iw,w));
  h=Math.max(1,Math.min(ih,h));
  x=Math.max(0,Math.min(iw-w,x));
  y=Math.max(0,Math.min(ih-h,y));
  return {x,y,w,h};
}
function fitLargest(ar){
  const iw=canvas.width,ih=canvas.height;
  let w,h;
  if(iw/ih>ar){h=ih;w=h*ar;}
  else{w=iw;h=w/ar;}
  w=Math.max(1,Math.round(w));
  h=Math.max(1,Math.round(h));
  if(w>iw){w=iw;h=Math.max(1,Math.round(w/ar));}
  if(h>ih){h=ih;w=Math.max(1,Math.round(h*ar));}
  if(w>iw)w=iw;
  sel=clampSel({x:(iw-w)/2,y:(ih-h)/2,w,h});
}
function selectAll(){
  if(!sourceImg)return;
  circle=false;
  sizePreset.value='';
  ratioNum=null;
  sel={x:0,y:0,w:canvas.width,h:canvas.height};
  render();
}
function markRatio(){
  document.querySelectorAll('#ratioSeg button').forEach(btn=>{
    const key=btn.dataset.ratio;
    if(key==='circle'){btn.classList.toggle('active',circle);return;}
    const r=parseRatio(key);
    const ar=circle?null:ratioNum;
    const on=(r==null&&ar==null)||(r&&ar&&Math.abs(r-ar)<0.02);
    btn.classList.toggle('active',!!on);
  });
}
function setField(el,value){
  if(document.activeElement!==el)el.value=String(value);
}
function render(){
  if(!sourceImg)return;
  sel=clampSel(sel);
  layoutBox();
  setField($('#px'),sel.x);
  setField($('#py'),sel.y);
  setField($('#pw'),sel.w);
  setField($('#ph'),sel.h);
  markRatio();
  box.classList.toggle('circle',circle);
  $('#cropTag').textContent=sel.w+' × '+sel.h;
  $('#meta').textContent=canvas.width+' × '+canvas.height+' px';
  $('#download').disabled=false;
  $('#cropHint').classList.add('show');
}
function layoutBox(){
  const viewW=canvas.clientWidth||canvas.width;
  const viewH=canvas.clientHeight||canvas.height;
  const sx=canvas.width?viewW/canvas.width:1;
  const sy=canvas.height?viewH/canvas.height:1;
  box.style.left=(PAD+sel.x*sx)+'px';
  box.style.top=(PAD+sel.y*sy)+'px';
  box.style.width=Math.max(1,sel.w*sx)+'px';
  box.style.height=Math.max(1,sel.h*sy)+'px';
  box.classList.toggle('tagAbove',sel.y*sy>28);
}
function fitCanvasDisplay(attempt){
  if(!sourceImg)return;
  const wrap=$('#wrap');
  const cs=getComputedStyle(wrap);
  const padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const padY=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  const maxW=wrap.clientWidth-padX;
  const maxH=wrap.clientHeight-padY;
  if(maxW<8||maxH<8){
    if((attempt||0)<30)requestAnimationFrame(()=>fitCanvasDisplay((attempt||0)+1));
    return;
  }
  const ow=sourceImg.naturalWidth,oh=sourceImg.naturalHeight;
  const s=Math.min(maxW/ow,maxH/oh,1);
  const scale=s>0?s:1;
  canvas.style.width=Math.round(ow*scale)+'px';
  canvas.style.height=Math.round(oh*scale)+'px';
  layoutBox();
}
function load(blob,filename){
  if(!blob||!blob.type.startsWith('image/')){if(blob)imagecAlert('errType');return;}
  origName=filename||'image';
  const img=new Image();
  const url=URL.createObjectURL(blob);
  img.onload=()=>{
    URL.revokeObjectURL(url);
    sourceImg=img;
    canvas.width=img.naturalWidth;
    canvas.height=img.naturalHeight;
    ctx.drawImage(img,0,0);
    sel={x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
    ratioNum=null;
    circle=false;
    sizePreset.value='';
    sizePreset.disabled=false;
    empty.style.display='none';
    document.body.classList.add('has-file');
    $('#cropFrame').classList.add('on');
    fitCanvasDisplay();
    render();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);imagecAlert('errLoad');};
  img.src=url;
}

function pointerImage(e,snap){
  const rect=canvas.getBoundingClientRect();
  let sx=e.clientX-rect.left;
  let sy=e.clientY-rect.top;
  if(snap){
    if(sx<=6)sx=0;
    else if(rect.width-sx<=6)sx=rect.width;
    if(sy<=6)sy=0;
    else if(rect.height-sy<=6)sy=rect.height;
  }
  sx=Math.max(0,Math.min(rect.width||0,sx));
  sy=Math.max(0,Math.min(rect.height||0,sy));
  return {
    x:rect.width?(sx/rect.width)*canvas.width:0,
    y:rect.height?(sy/rect.height)*canvas.height:0
  };
}
function pointerRaw(e){
  const rect=canvas.getBoundingClientRect();
  return {
    x:rect.width?(e.clientX-rect.left)/rect.width*canvas.width:0,
    y:rect.height?(e.clientY-rect.top)/rect.height*canvas.height:0
  };
}
function hitTest(e){
  const r=box.getBoundingClientRect();
  const m=e.pointerType==='touch'?24:14;
  const x=e.clientX,y=e.clientY;
  const nearL=Math.abs(x-r.left)<=m;
  const nearR=Math.abs(x-r.right)<=m;
  const nearT=Math.abs(y-r.top)<=m;
  const nearB=Math.abs(y-r.bottom)<=m;
  const inX=x>=r.left-m&&x<=r.right+m;
  const inY=y>=r.top-m&&y<=r.bottom+m;
  if(nearL&&nearT)return 'nw';
  if(nearR&&nearT)return 'ne';
  if(nearL&&nearB)return 'sw';
  if(nearR&&nearB)return 'se';
  if(nearT&&inX)return 'n';
  if(nearB&&inX)return 's';
  if(nearL&&inY)return 'w';
  if(nearR&&inY)return 'e';
  if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return 'move';
  return 'new';
}
function cursorFor(kind){
  if(kind==='nw'||kind==='se')return 'nwse-resize';
  if(kind==='ne'||kind==='sw')return 'nesw-resize';
  if(kind==='n'||kind==='s')return 'ns-resize';
  if(kind==='e'||kind==='w')return 'ew-resize';
  if(kind==='move')return 'move';
  return 'crosshair';
}
function magnet(s){
  if(currentAR())return clampSel(s);
  const rect=canvas.getBoundingClientRect();
  const mx=rect.width?6/rect.width*canvas.width:0;
  const my=rect.height?6/rect.height*canvas.height:0;
  let x=s.x,y=s.y,r=s.x+s.w,b=s.y+s.h;
  if(x<mx)x=0;
  if(y<my)y=0;
  if(canvas.width-r<mx)r=canvas.width;
  if(canvas.height-b<my)b=canvas.height;
  return clampSel({x,y,w:r-x,h:b-y});
}
function fromAnchor(ax,ay,px,py,ar){
  const iw=canvas.width,ih=canvas.height;
  let dx=px-ax,dy=py-ay;
  let sx=dx<0?-1:1,sy=dy<0?-1:1;
  let w=Math.abs(dx),h=Math.abs(dy);
  if(ar){
    if(h<1)h=1;
    if(w/h>ar)w=h*ar;
    else h=w/ar;
  }
  const maxW=sx<0?ax:iw-ax;
  const maxH=sy<0?ay:ih-ay;
  if(w>maxW){w=maxW;if(ar)h=w/ar;}
  if(h>maxH){h=maxH;if(ar)w=h*ar;}
  if(w>maxW)w=maxW;
  if(h>maxH)h=maxH;
  w=Math.max(1,w);h=Math.max(1,h);
  const x=sx<0?ax-w:ax;
  const y=sy<0?ay-h:ay;
  return clampSel({x,y,w,h});
}
function edgeRatio(handle,p,origin,ar){
  const iw=canvas.width,ih=canvas.height;
  if(handle==='e'||handle==='w'){
    const ax=handle==='e'?origin.x:origin.x+origin.w;
    let w=Math.max(1,Math.abs(p.x-ax));
    let h=w/ar;
    let cy=origin.y+origin.h/2;
    let y=cy-h/2;
    let x=handle==='w'?ax-w:ax;
    if(y<0){h=Math.max(1,cy*2);y=0;w=h*ar;x=handle==='w'?ax-w:ax;}
    if(y+h>ih){h=Math.max(1,(ih-cy)*2);y=cy-h/2;w=h*ar;x=handle==='w'?ax-w:ax;}
    const maxW=handle==='w'?ax:iw-ax;
    if(w>maxW){w=maxW;h=w/ar;y=cy-h/2;x=handle==='w'?ax-w:ax;}
    return clampSel({x,y,w,h});
  }
  const ay=handle==='s'?origin.y:origin.y+origin.h;
  let h=Math.max(1,Math.abs(p.y-ay));
  let w=h*ar;
  let cx=origin.x+origin.w/2;
  let x=cx-w/2;
  let y=handle==='n'?ay-h:ay;
  if(x<0){w=Math.max(1,cx*2);x=0;h=w/ar;y=handle==='n'?ay-h:ay;}
  if(x+w>iw){w=Math.max(1,(iw-cx)*2);x=cx-w/2;h=w/ar;y=handle==='n'?ay-h:ay;}
  const maxH=handle==='n'?ay:ih-ay;
  if(h>maxH){h=maxH;w=h*ar;x=cx-w/2;y=handle==='n'?ay-h:ay;}
  return clampSel({x,y,w,h});
}
function resized(kind,p){
  const origin=drag.origin;
  const ar=currentAR();
  if(kind==='move'){
    return magnet({x:origin.x+(p.x-drag.ax),y:origin.y+(p.y-drag.ay),w:origin.w,h:origin.h});
  }
  if(kind==='new'){
    if(!ar)return magnet({x:Math.min(drag.anchor.x,p.x),y:Math.min(drag.anchor.y,p.y),w:Math.abs(p.x-drag.anchor.x),h:Math.abs(p.y-drag.anchor.y)});
    return fromAnchor(drag.anchor.x,drag.anchor.y,p.x,p.y,ar);
  }
  if(ar&&(kind==='n'||kind==='s'||kind==='e'||kind==='w'))return edgeRatio(kind,p,origin,ar);
  if(ar){
    const r=origin.x+origin.w,b=origin.y+origin.h;
    const anchor=kind==='se'?{x:origin.x,y:origin.y}:kind==='nw'?{x:r,y:b}:kind==='ne'?{x:origin.x,y:b}:{x:r,y:origin.y};
    return fromAnchor(anchor.x,anchor.y,p.x,p.y,ar);
  }
  let L=origin.x,T=origin.y,R=origin.x+origin.w,B=origin.y+origin.h;
  if(kind.includes('w'))L=p.x;
  if(kind.includes('e'))R=p.x;
  if(kind.includes('n'))T=p.y;
  if(kind.includes('s'))B=p.y;
  if(R<L){const t=L;L=R;R=t;}
  if(B<T){const t=T;T=B;B=t;}
  return magnet({x:L,y:T,w:R-L,h:B-T});
}

overlay.addEventListener('pointerdown',e=>{

function onSelInput(src){
  if(!sourceImg)return;
  let x=num($('#px'),sel.x),y=num($('#py'),sel.y),w=num($('#pw'),sel.w),h=num($('#ph'),sel.h);
  const ar=currentAR();
  const iw=canvas.width,ih=canvas.height;
  if(ar&&src==='w')h=w/ar;
  if(ar&&src==='h')w=h*ar;
  if(src==='x'||src==='y'){
    x=Math.max(0,Math.min(iw-1,x));
    y=Math.max(0,Math.min(ih-1,y));
    if(x+w>iw)w=iw-x;
    if(y+h>ih)h=ih-y;
    if(ar){
      h=w/ar;
      if(y+h>ih){h=Math.max(1,ih-y);w=h*ar;}
      if(x+w>iw){w=Math.max(1,iw-x);h=w/ar;}
    }
  }
  sel=clampSel({x,y,w,h});
  render();
}

    cx.clip();
    cx.drawImage(sourceImg,ssx,ssy,side,side,0,0,side,side);

window.addEventListener('keydown',e=>{

  if(e.target&&e.target.matches&&e.target.matches('input,textarea,select,button,summary'))return;
  const step=e.shiftKey?10:1;
  let x=sel.x,y=sel.y;
  if(e.key==='ArrowLeft')x-=step;
  else if(e.key==='ArrowRight')x+=step;

  else if(e.key==='ArrowDown')y+=step;

  render();
});

function detectLang(){
  const params=new URLSearchParams(location.search);const url=params.get('lang');
  if(url&&LANGS.includes(url))return url;
  try{const s=localStorage.getItem('language');if(s&&LANGS.includes(s))return s;}catch(e){}
  const ns=navigator.languages||[navigator.language];
  for(const l0 of ns){if(!l0)continue;const l=l0.toLowerCase();
    if(l.startsWith('zh'))return 'zh';if(l.startsWith('en'))return 'en';if(l.startsWith('ja'))return 'ja';
    if(l.startsWith('ko'))return 'ko';if(l.startsWith('es'))return 'es';if(l.startsWith('fr'))return 'fr';
    if(l.startsWith('de'))return 'de';if(l.startsWith('ru'))return 'ru';if(l.startsWith('pt'))return 'pt';
    if(l.startsWith('ar'))return 'ar';if(l.startsWith('vi'))return 'vi';if(l.startsWith('id'))return 'id';
    if(l.startsWith('th'))return 'th';
  }return 'en';
}
let language=detectLang();
function setLanguage(lang){
  if(!LANGS.includes(lang))lang='en';
  language=lang;
  const rtl=lang==='ar';
  document.documentElement.lang=lang==='zh'?'zh-CN':lang;
  document.documentElement.dir=rtl?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');const v=messages[lang][k];
    if(typeof v==='string'){el.innerHTML=v;}
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const k=el.getAttribute('data-i18n-ph');el.placeholder=messages[lang][k]||el.placeholder;
  });
  const s=SEO[lang];
  document.title=s.title;
  const M=[
    ['meta[name="description"]','content',s.desc],
    ['meta[property="og:title"]','content',s.ogTitle],
    ['meta[property="og:description"]','content',s.ogDesc],
    ['meta[property="og:site_name"]','content',s.siteName],
    ['meta[property="og:locale"]','content',s.locale],
    ['meta[name="twitter:title"]','content',s.ogTitle],
    ['meta[name="twitter:description"]','content',s.ogDesc],
    ['meta[name="application-name"]','content',s.siteName],
    ['meta[name="apple-mobile-web-app-title"]','content',s.siteName]
  ];
  M.forEach(([sel,attr,val])=>{const t=document.querySelector(sel);if(t)t.setAttribute(attr,val);});
  const ld=document.getElementById('ldjson');
  if(ld){try{let d=JSON.parse(ld.textContent);d.name=s.ogTitle;d.alternateName=s.siteName;d.description=s.jsonLdDesc;ld.textContent=JSON.stringify(d);}catch(e){}}
  try{localStorage.setItem('language',lang);}catch(e){}
  const selL=document.getElementById('langSelect');if(selL)selL.value=lang;
}
(function initI18n(){
  const LANG_NAMES={zh:'中文',en:'English',ja:'日本語',ko:'한국어',es:'Español',fr:'Français',de:'Deutsch',ru:'Русский',pt:'Português',ar:'العربية',vi:'Tiếng Việt',id:'Bahasa Indonesia',th:'ไทย'};
  const sel=document.getElementById('langSelect');if(sel){sel.innerHTML=LANGS.map(l=>`<option value="${l}">${LANG_NAMES[l]||l}</option>`).join('');sel.onchange=()=>{setLanguage(sel.value);const url=new URL(location.href);url.searchParams.set('lang',sel.value);history.replaceState(null,'',url.toString());};}
  const l=detectLang();setLanguage(l);
})();
