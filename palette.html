<script>
const $=s=>document.querySelector(s);
const LANGS=[
  {code:'zh',name:'中文',dir:'ltr'},{code:'en',name:'English',dir:'ltr'},{code:'ja',name:'日本語',dir:'ltr'},
  {code:'ko',name:'한국어',dir:'ltr'},{code:'es',name:'Español',dir:'ltr'},{code:'fr',name:'Français',dir:'ltr'},
  {code:'de',name:'Deutsch',dir:'ltr'},{code:'ru',name:'Русский',dir:'ltr'},{code:'pt',name:'Português',dir:'ltr'},
  {code:'ar',name:'العربية',dir:'rtl'},{code:'vi',name:'Tiếng Việt',dir:'ltr'},{code:'id',name:'Bahasa Indonesia',dir:'ltr'},
  {code:'th',name:'ไทย',dir:'ltr'}
];
const SEO={
  zh:{title:'提取配色 - 图片主色 HEX/RGB｜imagec',desc:'从图片提取主色，显示色块和 HEX、RGB。点一下复制色值，也可以在预览上取色。浏览器本地处理，图片不上传。'},
  en:{title:'Image color palette | HEX and RGB | imagec',desc:'Pull the dominant colors from a picture. Swatches show HEX and RGB — click to copy, or pick a pixel on the preview. Processed locally, nothing is uploaded.'}
};
const messages={
  zh:{title:'提取配色',subtitle:'从图片提取主色，一键复制 HEX。',privacy:'本地处理 · 不上传服务器',upload:'点击选择或拖入图片',formats:'支持 PNG、JPG、WebP、GIF<br>也可直接粘贴图片',sampleNote:'取色会先缩到约 1400px 边长再采样，大图色值可能略有偏差。',count:'颜色数量',countHint:'3–12，默认 6',pickHint:'点击预览图可以取一个颜色。',copyAll:'复制全部 HEX',clear:'清空',waiting:'等待图片',emptyTitle:'把图片放进来，提取主色',ready:'{w} × {h} px · {n} 色',copied:'已复制',pick:'取色',pickLabel:'从预览取到的颜色',errType:'请选择 PNG、JPG、WebP 或 GIF。',errHeic:'暂不支持 HEIC，请先用「转换 HEIC」转成 JPG 或 PNG。',errLoad:'图片加载失败，可能是格式不支持或文件已损坏。',errNone:'这张图没有可用的颜色。',moreTools:'更多图片工具',linkFilter:'滤镜调色',linkConvert:'转换格式'},
  en:{title:'Color palette',subtitle:'Extract main colors and copy HEX in one click.',privacy:'Local · no upload',upload:'Choose or drop an image',formats:'PNG, JPG, WebP, and GIF<br>You can also paste an image',count:'Color count',countHint:'3–12, default 6',pickHint:'Click the preview to pick a color.',copyAll:'Copy all HEX',clear:'Clear',waiting:'Waiting for an image',emptyTitle:'Drop an image to extract its colors',sampleNote:'Colors are sampled after shrinking the long edge to about 1400px, so large images may differ slightly.',ready:'{w} × {h} px · {n} colors',copied:'Copied',pick:'Picked color',pickLabel:'Color sampled from the preview',errType:'Choose a PNG, JPG, WebP, or GIF.',errHeic:'HEIC is not supported here. Convert it to JPG or PNG first.',errLoad:'Could not load the image. The format may be unsupported or the file is damaged.',errNone:'This image has no usable colors.',moreTools:'More image tools',linkFilter:'Filters',linkConvert:'Convert a format'}
};
let language=detectLang();
let colors=[];
let picked=null;
let hasImage=false;
const canvas=$('#canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const langSelect=$('#langSelect');
LANGS.forEach(l=>{
  const opt=document.createElement('option');
  opt.value=l.code;
  opt.textContent=l.name;
  langSelect.appendChild(opt);
});
function knownLang(code){return LANGS.some(l=>l.code===code);}
function detectLang(){
  const param=new URL(location.href).searchParams.get('lang');
  if(param&&knownLang(param))return param;
  let saved='';
  try{saved=localStorage.getItem('language')||'';}catch(e){}
  if(saved&&knownLang(saved))return saved;
  const navLangs=navigator.languages||[navigator.language||'zh'];
  for(const l of navLangs){
    const lc=String(l).toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    const code=lc.slice(0,2);
    if(knownLang(code))return code;
  }
  return 'zh';
}
function t(key){
  const pack=messages[language];
  if(pack&&pack[key]!=null)return pack[key];
  if(messages.en&&messages.en[key]!=null)return messages.en[key];
  if(messages.zh&&messages.zh[key]!=null)return messages.zh[key];
  return key;
}
function tf(key,map){
  let s=t(key);
  Object.keys(map||{}).forEach(k=>{s=s.replaceAll('{'+k+'}',String(map[k]));});
  return s;
}
function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}
function applyI18n(){
  const def=LANGS.find(l=>l.code===language)||LANGS[0];
  document.documentElement.lang=language==='zh'?'zh-CN':language;
  document.documentElement.dir=def.dir;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    const value=t(key);
    if(value!==key)el.innerHTML=value;
  });
  $('#countV').textContent=$('#count').value;
  const seo=SEO[language]||SEO.en||SEO.zh;
  document.title=seo.title;
  setMeta('name','description',seo.desc);
  setMeta('property','og:title',seo.title);
  setMeta('property','og:description',seo.desc);
  setMeta('name','twitter:title',seo.title);
  setMeta('name','twitter:description',seo.desc);
  const ld=document.querySelector('#ldjson');
  if(ld){
    try{
      const obj=JSON.parse(ld.textContent);
      obj.name=t('title');
      obj.description=seo.desc;
      ld.textContent=JSON.stringify(obj);
    }catch(e){}
  }
  const banner=$('#libStatus');
  if(banner&&!banner.hidden&&banner.dataset.key)banner.textContent=t(banner.dataset.key);
  paintSwatches();
  paintPicked();
  paintMeta();
}
function setLanguage(lang){
  if(!knownLang(lang))lang='en';
  language=lang;
  try{localStorage.setItem('language',lang);}catch(e){}
  langSelect.value=language;
  applyI18n();
}
function showBanner(key){
  const el=$('#libStatus');
  if(!el)return;
  if(!key){el.hidden=true;el.textContent='';delete el.dataset.key;return;}
  el.dataset.key=key;
  el.hidden=false;
  el.textContent=t(key);
}
function kindOf(file){
  const name=(file.name||'').toLowerCase();
  const type=(file.type||'').toLowerCase();
  if(type.indexOf('heic')!==-1||type.indexOf('heif')!==-1||name.endsWith('.heic')||name.endsWith('.heif'))return 'heic';
  if(type==='image/png'||name.endsWith('.png'))return 'png';
  if(type==='image/jpeg'||type==='image/jpg'||name.endsWith('.jpg')||name.endsWith('.jpeg'))return 'jpeg';
  if(type==='image/webp'||name.endsWith('.webp'))return 'webp';
  if(type==='image/gif'||name.endsWith('.gif'))return 'gif';
  if(type.indexOf('image/')===0)return 'image';
  return '';
}
function countValue(){
  const n=parseInt($('#count').value,10);
  if(!Number.isFinite(n))return 6;
  return Math.min(12,Math.max(3,n));
}
function hexOf(r,g,b){
  const h=n=>Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,'0');
  return ('#'+h(r)+h(g)+h(b)).toUpperCase();
}
function rgbOf(r,g,b){
  return 'rgb('+Math.round(r)+', '+Math.round(g)+', '+Math.round(b)+')';
}
function dist2(a,b){
  const dr=a[0]-b[0], dg=a[1]-b[1], db=a[2]-b[2];
  return dr*dr+dg*dg+db*db;
}
function kmeans(pixels,k){
  if(!pixels.length)return [];
  const unique=[];
  const seen=new Set();
  for(let i=0;i<pixels.length&&unique.length<k;i+=Math.max(1,Math.floor(pixels.length/k))){
    const key=pixels[i].join(',');
    if(seen.has(key))continue;
    seen.add(key);
    unique.push(pixels[i].slice());
  }
  if(unique.length<k){
    for(let i=0;i<pixels.length&&unique.length<k;i++){
      const key=pixels[i].join(',');
      if(seen.has(key))continue;
      seen.add(key);
      unique.push(pixels[i].slice());
    }
  }
  const centroids=unique.slice(0,Math.min(k,unique.length));
  while(centroids.length<k)centroids.push(pixels[centroids.length%pixels.length].slice());
  const assign=new Uint16Array(pixels.length);
  for(let iter=0;iter<10;iter++){
    for(let i=0;i<pixels.length;i++){
      let best=0,bestD=Infinity;
      const p=pixels[i];
      for(let c=0;c<centroids.length;c++){
        const d=dist2(p,centroids[c]);
        if(d<bestD){bestD=d;best=c;}
      }
      assign[i]=best;
    }
    const sum=centroids.map(()=>[0,0,0,0]);
    for(let i=0;i<pixels.length;i++){
      const c=assign[i];
      sum[c][0]+=pixels[i][0];
      sum[c][1]+=pixels[i][1];
      sum[c][2]+=pixels[i][2];
      sum[c][3]++;
    }
    for(let c=0;c<centroids.length;c++){
      if(!sum[c][3])continue;
      centroids[c]=[sum[c][0]/sum[c][3],sum[c][1]/sum[c][3],sum[c][2]/sum[c][3]];
    }
  }
  const counts=centroids.map(()=>0);
  for(let i=0;i<assign.length;i++)counts[assign[i]]++;
  return centroids.map((c,i)=>({r:c[0],g:c[1],b:c[2],n:counts[i]})).filter(c=>c.n>0).sort((a,b)=>b.n-a.n);
}
function samplePixels(){
  const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  const total=canvas.width*canvas.height;
  const step=Math.max(1,Math.floor(total/12000));
  const pixels=[];
  for(let i=0;i<total;i+=step){
    const p=i*4;
    if(data[p+3]<200)continue;
    pixels.push([data[p],data[p+1],data[p+2]]);
  }
  if(pixels.length)return pixels;
  for(let i=0;i<total;i+=step){
    const p=i*4;
    if(data[p+3]<16)continue;
    pixels.push([data[p],data[p+1],data[p+2]]);
  }
  return pixels;
}
function extract(){
  if(!hasImage||!canvas.width)return;
  const pixels=samplePixels();
  if(!pixels.length){colors=[];paintSwatches();showBanner('errNone');paintMeta();return;}
  showBanner('');
  colors=kmeans(pixels,countValue()).map(c=>({
    hex:hexOf(c.r,c.g,c.b),
    rgb:rgbOf(c.r,c.g,c.b)
  }));
  paintSwatches();
  paintMeta();
  $('#copyAll').disabled=!colors.length;
  $('#clear').disabled=false;
}
function swatchButton(color,label){
  const btn=document.createElement('button');
  btn.type='button';
  btn.className='swatch';
  btn.innerHTML='<i></i><b></b><span></span>';
  btn.querySelector('i').style.background=color.hex;
  btn.querySelector('b').textContent=color.hex;
  btn.querySelector('span').textContent=label||color.rgb;
  btn.addEventListener('click',()=>copyText(color.hex,btn.querySelector('b'),color.hex));
  return btn;
}
function paintSwatches(){
  const box=$('#swatches');
  box.innerHTML='';
  colors.forEach(color=>box.appendChild(swatchButton(color,color.rgb)));
}
function paintPicked(){
  const box=$('#picked');
  box.innerHTML='';
  if(!picked){box.hidden=true;return;}
  box.hidden=false;
  const btn=swatchButton(picked,t('pick')+' · '+picked.rgb);
  box.appendChild(btn);
}
function paintMeta(){
  const note=$('#sampleNote'); if(note){note.hidden=false; note.textContent=t('sampleNote');}
  const meta=$('#meta');
  if(!meta)return;
  if(hasImage&&canvas.width){
    meta.textContent=tf('ready',{w:canvas.width,h:canvas.height,n:colors.length});
    return;
  }
  meta.textContent=t('waiting');
}
function showEmpty(){
  hasImage=false;
  colors=[];
  picked=null;
  canvas.width=0;
  canvas.height=0;
  canvas.style.display='none';
  $('#swatches').innerHTML='';
  $('#picked').hidden=true;
  $('#empty').style.display='';
  $('#copyAll').disabled=true;
  $('#clear').disabled=true;
  $('#file').value='';
  paintMeta();
}
async function copyText(text,labelEl,restore){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text;
    document.body.appendChild(ta);
    ta.select();
    try{document.execCommand('copy');}catch(err){}
    ta.remove();
  }
  if(!labelEl)return;
  labelEl.textContent=t('copied');
  setTimeout(()=>{if(labelEl.textContent===t('copied'))labelEl.textContent=restore;},900);
}
function loadImage(blob){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(blob);
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('load'));};
    img.src=url;
  });
}
function draw(img){
  const edge=Math.max(img.naturalWidth,img.naturalHeight)||1;
  const scale=edge>1400?1400/edge:1;
  canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
  canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  canvas.style.display='block';
  $('#empty').style.display='none';
  hasImage=true;
  $('#clear').disabled=false;
}
async function load(file){
  if(!file)return;
  const kind=kindOf(file);
  if(kind==='heic'){showBanner('errHeic');return;}
  if(!kind){showBanner('errType');return;}
  showBanner('');
  try{
    const img=await loadImage(file);
    draw(img);
    extract();
  }catch(e){
    showEmpty();
    showBanner('errLoad');
  }
}
canvas.addEventListener('click',e=>{
  if(!hasImage||!canvas.width)return;
  const rect=canvas.getBoundingClientRect();
  if(!rect.width||!rect.height)return;
  const x=Math.min(canvas.width-1,Math.max(0,Math.floor((e.clientX-rect.left)*canvas.width/rect.width)));
  const y=Math.min(canvas.height-1,Math.max(0,Math.floor((e.clientY-rect.top)*canvas.height/rect.height)));
  const px=ctx.getImageData(x,y,1,1).data;
  picked={hex:hexOf(px[0],px[1],px[2]),rgb:rgbOf(px[0],px[1],px[2]),a:px[3]};
  paintPicked();
});
function bindDrop(){
  const drop=$('#drop');
  ['dragenter','dragover'].forEach(type=>{
    drop.addEventListener(type,ev=>{ev.preventDefault();drop.classList.add('over');});
  });
  ['dragleave','drop'].forEach(type=>{
    drop.addEventListener(type,ev=>{ev.preventDefault();drop.classList.remove('over');});
  });
  drop.addEventListener('drop',e=>{
    const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(file)load(file);
  });
}
$('#file').addEventListener('change',e=>{
  if(e.target.files&&e.target.files[0])load(e.target.files[0]);
});
bindDrop();
document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(const item of items){
    if(item.type&&item.type.indexOf('image/')===0){
      const file=item.getAsFile();
      if(file){load(file);break;}
    }
  }
});
$('#count').addEventListener('input',()=>{
  $('#countV').textContent=String(countValue());
  if(hasImage)extract();
});
$('#copyAll').addEventListener('click',()=>{
  if(!colors.length)return;
  copyText(colors.map(c=>c.hex).join('\n'),$('#copyAll'),t('copyAll'));
});
$('#clear').addEventListener('click',()=>{showBanner('');showEmpty();});
langSelect.addEventListener('change',()=>setLanguage(langSelect.value));
setLanguage(language);
(function watchCards(){
  const grid=document.querySelector('[data-tool-cards]');
  if(!grid)return;
  const fix=()=>{
    grid.querySelectorAll('[data-i18n]').forEach(el=>{
      const key=el.getAttribute('data-i18n');
      const value=t(key);
      if(value!==key&&el.textContent!==value)el.textContent=value;
    });
  };
  new MutationObserver(fix).observe(grid,{childList:true,subtree:true});
})();
document.addEventListener('DOMContentLoaded',applyI18n);
</script>
