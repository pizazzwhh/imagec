let language=detectLang();
let source=null;
let baseName='image';
let originalSize=0;
let outputBlob=null;
let fmt='png';
let rotation=0;
let flipH=false;
let flipV=false;
let status='empty';
let scaled=false;
let seq=0;
let measureSeq=0;
const MAX_EDGE=8192;
const canvas=$('#canvas');
const ctx=canvas.getContext('2d');
const langSelect=$('#langSelect');
LANGS.forEach(l=>{
  const opt=document.createElement('option');
  opt.value=l.code;
  opt.textContent=l.name;
  langSelect.appendChild(opt);
});
function detectLang(){
  const param=new URL(location.href).searchParams.get('lang');
  if(param&&messages[param])return param;
  let saved='';
  try{saved=localStorage.getItem('language')||'';}catch(e){}
  if(saved&&messages[saved])return saved;
  const navLangs=navigator.languages||[navigator.language||'zh'];
  for(const l of navLangs){
    const lc=String(l).toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    const code=lc.slice(0,2);
    if(messages[code])return code;
  }
  return 'zh';
}
function t(key){
  const pack=messages[language]||messages.en||messages.zh;
  if(pack&&pack[key]!=null)return pack[key];
  if(messages.en&&messages.en[key]!=null)return messages.en[key];
  if(messages.zh&&messages.zh[key]!=null)return messages.zh[key];
  return key;
}
function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}
function applyI18n(){
  const def=LANGS.find(l=>l.code===language)||LANGS[0];
  document.documentElement.lang=language==='zh'?'zh-CN':language;
  document.documentElement.dir=def.dir;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    const value=t(key);
    if(value!==key)el.innerHTML=value;
  });
  $('#qualityV').textContent=$('#quality').value;
  const seo=SEO[language]||SEO.en||SEO.zh;
  document.title=seo.title;
  setMeta('name','description',seo.desc);
  setMeta('property','og:title',seo.title);
  setMeta('property','og:description',seo.desc);
  setMeta('name','twitter:title',seo.title);
  setMeta('name','twitter:description',seo.desc);
  const ld=document.querySelector('#ldjson');
  if(ld){
    try{
      const obj=JSON.parse(ld.textContent);
      obj.name=t('title');
      obj.description=seo.desc;
      ld.textContent=JSON.stringify(obj);
    }catch(e){}
  }
  paintMeta();
  const banner=$('#libStatus');
  if(banner&&!banner.hidden&&banner.dataset.key)banner.textContent=t(banner.dataset.key);
}
function setLanguage(lang){
  if(!messages[lang])lang='en';
  language=lang;
  try{localStorage.setItem('language',lang);}catch(e){}
  langSelect.value=language;
  applyI18n();
}
function showBanner(key){
  const el=$('#libStatus');
  if(!el)return;
  if(!key){el.hidden=true;el.textContent='';delete el.dataset.key;return;}
  el.dataset.key=key;
  el.hidden=false;
  el.textContent=t(key);
}
function formatBytes(n){
  n=Number(n)||0;
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
function kindOf(file){
  const name=(file.name||'').toLowerCase();
  const type=(file.type||'').toLowerCase();
  if(type.indexOf('heic')!==-1||type.indexOf('heif')!==-1||name.endsWith('.heic')||name.endsWith('.heif'))return 'heic';
  if(type==='image/png'||name.endsWith('.png'))return 'png';
  if(type==='image/jpeg'||type==='image/jpg'||name.endsWith('.jpg')||name.endsWith('.jpeg'))return 'jpeg';
  if(type==='image/webp'||name.endsWith('.webp'))return 'webp';
  if(type.indexOf('image/')===0)return 'image';
  return '';
}
function loadImage(blob){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(blob);
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('load'));};
    img.src=url;
  });
}
function paintMeta(){
  const meta=$('#meta');
  if(!meta)return;
  if(status==='working'){meta.textContent=t('working');return;}
  if(status==='ready'&&source){
    let text=t('ready').replace('{w}',String(canvas.width)).replace('{h}',String(canvas.height));
    if(scaled)text+=' · '+t('scaled');
    meta.textContent=text;
    return;
  }
  meta.textContent=t('waiting');
}
function syncFmt(){
  $('#fmtSeg').querySelectorAll('button').forEach(btn=>{
    btn.classList.toggle('active',btn.getAttribute('data-fmt')===fmt);
  });
  $('#qualityGroup').style.display=fmt==='jpeg'?'':'none';
  $('#jpgNote').style.display=fmt==='jpeg'?'':'none';
}
function syncFlip(){
  $('#flipH').classList.toggle('active',flipH);
  $('#flipV').classList.toggle('active',flipV);
  $('#flipH').setAttribute('aria-pressed',flipH?'true':'false');
  $('#flipV').setAttribute('aria-pressed',flipV?'true':'false');
}
function showEmpty(){
  source=null;
  outputBlob=null;
  scaled=false;
  status='empty';
  canvas.width=0;
  canvas.height=0;
  canvas.style.display='none';
  $('#empty').style.display='';
  $('#download').disabled=true;
  $('#clear').disabled=true;
  $('#stats').style.display='none';
  $('#file').value='';
  paintMeta();
}
function renderPreview(){
  const edge=Math.max(source.naturalWidth,source.naturalHeight)||1;
  const scale=edge>MAX_EDGE?MAX_EDGE/edge:1;
  scaled=scale<1;
  const sw=Math.max(1,Math.round(source.naturalWidth*scale));
  const sh=Math.max(1,Math.round(source.naturalHeight*scale));
  const swap=rotation===90||rotation===270;
  const w=swap?sh:sw;
  const h=swap?sw:sh;
  canvas.width=w;
  canvas.height=h;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.save();
  ctx.translate(w/2,h/2);
  ctx.scale(flipH?-1:1,flipV?-1:1);
  ctx.rotate(rotation*Math.PI/180);
  ctx.drawImage(source,-sw/2,-sh/2,sw,sh);
  ctx.restore();
  status='ready';
  canvas.style.display='block';
  $('#empty').style.display='none';
  $('#clear').disabled=false;
  paintMeta();
}
function makeBlob(){
  return new Promise(resolve=>{
    if(!canvas.width||!canvas.height){resolve(null);return;}
    const mime=fmt==='png'?'image/png':'image/jpeg';
    const q=(parseInt($('#quality').value,10)||85)/100;
    let target=canvas;
    if(mime==='image/jpeg'){
      const off=document.createElement('canvas');
      off.width=canvas.width;
      off.height=canvas.height;
      const o=off.getContext('2d');
      o.fillStyle='#ffffff';
      o.fillRect(0,0,off.width,off.height);
      o.drawImage(canvas,0,0);
      target=off;
    }
    try{
      target.toBlob(blob=>resolve(blob),mime,mime==='image/png'?undefined:q);
    }catch(e){resolve(null);}
  });
}
function scheduleMeasure(){
  clearTimeout(scheduleMeasure.timer);
  scheduleMeasure.timer=setTimeout(runMeasure,80);
}
async function runMeasure(){
  const id=++measureSeq;
  $('#download').disabled=true;
  const blob=await makeBlob();
  if(id!==measureSeq||status!=='ready')return;
  if(!blob){showBanner('errExport');return;}
  showBanner('');
  outputBlob=blob;
  $('#origSize').textContent=formatBytes(originalSize);
  $('#newSize').textContent=formatBytes(blob.size);
  $('#newBox').classList.toggle('saved',blob.size<=originalSize);
  $('#stats').style.display='';
  $('#download').disabled=false;
  $('#clear').disabled=false;
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function load(file){
  if(!file)return;
  const kind=kindOf(file);
  if(kind==='heic'){showBanner('errHeic');return;}
  if(!kind){showBanner('errType');return;}
  const id=++seq;
  showBanner('');
  status='working';
  $('#empty').style.display='none';
  canvas.style.display='none';
  $('#download').disabled=true;
  $('#clear').disabled=false;
  $('#stats').style.display='none';
  paintMeta();
  try{
    const img=await loadImage(file);
    if(id!==seq)return;
    source=img;
    originalSize=file.size||0;
    baseName=(file.name||'image').replace(/\.[^.]+$/,'')||'image';
    renderPreview();
    scheduleMeasure();
  }catch(e){
    if(id!==seq)return;
    showEmpty();
    showBanner('errLoad');
  }
}
$('#file').addEventListener('change',e=>{
  if(e.target.files&&e.target.files[0])load(e.target.files[0]);
});
['dragenter','dragover'].forEach(type=>{
  $('#drop').addEventListener(type,ev=>{ev.preventDefault();$('#drop').classList.add('over');});
});
['dragleave','drop'].forEach(type=>{
  $('#drop').addEventListener(type,ev=>{ev.preventDefault();$('#drop').classList.remove('over');});
});
$('#drop').addEventListener('drop',e=>{
  const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(file)load(file);
});
document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(const item of items){
    if(item.type&&item.type.indexOf('image/')===0){
      const file=item.getAsFile();
      if(file){load(file);break;}
    }
  }
});
$('#rotSeg').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-rot]');
  if(!btn)return;
  rotation=parseInt(btn.getAttribute('data-rot'),10)||0;
  $('#rotSeg').querySelectorAll('button').forEach(el=>el.classList.toggle('active',el===btn));
  if(source){renderPreview();scheduleMeasure();}
});
$('#flipSeg').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-flip]');
  if(!btn)return;
  if(btn.getAttribute('data-flip')==='h')flipH=!flipH;
  else flipV=!flipV;
  syncFlip();
  if(source){renderPreview();scheduleMeasure();}
});
$('#fmtSeg').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-fmt]');
  if(!btn)return;
  fmt=btn.getAttribute('data-fmt');
  syncFmt();
  if(source)scheduleMeasure();
});
$('#quality').addEventListener('input',()=>{
  $('#qualityV').textContent=$('#quality').value;
  if(source)scheduleMeasure();
});
$('#clear').addEventListener('click',()=>{seq++;measureSeq++;showBanner('');showEmpty();});
$('#download').addEventListener('click',()=>{
  if($('#download').disabled||!outputBlob)return;
  const ext=fmt==='png'?'png':'jpg';
  downloadBlob(outputBlob,baseName+'-rotate.'+ext);
});
langSelect.addEventListener('change',()=>setLanguage(langSelect.value));
syncFmt();
syncFlip();
setLanguage(language);
(function watchCards(){
  const grid=document.querySelector('[data-tool-cards]');
  if(!grid)return;
  const fix=()=>{
    grid.querySelectorAll('[data-i18n]').forEach(el=>{
      const key=el.getAttribute('data-i18n');
      const value=t(key);
      if(value!==key&&el.textContent!==value)el.textContent=value;
    });
  };
  new MutationObserver(fix).observe(grid,{childList:true,subtree:true});
})();
document.addEventListener('DOMContentLoaded',applyI18n);
</script>
