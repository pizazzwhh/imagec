function knownLang(code){return LANGS.some(l=>l.code===code);}
function detectLang(){
  const param=new URL(location.href).searchParams.get('lang');
  if(param&&knownLang(param))return param;
  let saved='';
  try{saved=localStorage.getItem('language')||'';}catch(e){}
  if(saved&&knownLang(saved))return saved;
  const navLangs=navigator.languages||[navigator.language||'zh'];
  for(const l of navLangs){
    const lc=String(l).toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    const code=lc.slice(0,2);
    if(knownLang(code))return code;
  }
  return 'zh';
}
function t(key){
  const pack=messages[language];
  if(pack&&pack[key]!=null)return pack[key];
  if(messages.en&&messages.en[key]!=null)return messages.en[key];
  if(messages.zh&&messages.zh[key]!=null)return messages.zh[key];
  return key;
}
function tf(key,map){
  let s=t(key);
  Object.keys(map||{}).forEach(k=>{s=s.replaceAll('{'+k+'}',String(map[k]));});
  return s;
}
function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}
function byteLen(str){return new TextEncoder().encode(String(str||'')).length;}
function formatBytes(n){
  n=Number(n)||0;
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
function safeName(name){

  return clean||'image';
}

    comments:$('#optComments').checked,

function isEditorNs(ns){
  if(!ns)return false;
  return ns.indexOf('inkscape.org')!==-1||ns.indexOf('sodipodi')!==-1||ns.indexOf('ns.adobe.com')!==-1;
}
function isMetaPrefix(prefix){
  return /^(inkscape|sodipodi|adobe|illustrator|graph|dc|cc|rdf)$/i.test(prefix||'');
}
function prefixUsed(root,prefix){
  const all=[root,...root.querySelectorAll('*')];
  for(const el of all){
    if(el.prefix===prefix)return true;
    for(const attr of el.attributes){
      const name=attr.name||'';
      if(name==='xmlns:'+prefix)continue;
      if(attr.prefix===prefix)return true;
      if(name.startsWith(prefix+':'))return true;
    }
  }
  return false;
}
function stripEditor(svg){
  const all=[svg,...svg.querySelectorAll('*')];
  for(let i=all.length-1;i>=0;i--){
    const el=all[i];
    if(el===svg)continue;
    const tag=(el.localName||'').toLowerCase();
    const prefix=el.prefix||'';
    const adobeI=prefix==='i'&&isEditorNs(el.namespaceURI);
    if(isEditorNs(el.namespaceURI)||isMetaPrefix(prefix)||adobeI||tag==='metadata'||tag==='namedview')el.remove();
  }
  const left=[svg,...svg.querySelectorAll('*')];
  left.forEach(el=>{
    [...el.attributes].forEach(attr=>{
      const name=attr.name||'';
      const prefix=attr.prefix||(name.includes(':')?name.split(':')[0]:'');
      if(prefix==='xmlns')return;
      const adobeI=prefix==='i'&&isEditorNs(attr.namespaceURI);
      if(isMetaPrefix(prefix)||isEditorNs(attr.namespaceURI)||adobeI)el.removeAttributeNode(attr);
    });
  });
  [svg,...svg.querySelectorAll('*')].forEach(el=>{
    [...el.attributes].forEach(attr=>{
      const match=/^xmlns:([A-Za-z0-9_.-]+)$/.exec(attr.name||'');
      if(!match)return;
      const prefix=match[1];
      const value=attr.value||'';
      const editorDecl=isMetaPrefix(prefix)||isEditorNs(value)||(prefix==='i'&&isEditorNs(value));
      if(!editorDecl)return;
      if(prefixUsed(svg,prefix))return;
      el.removeAttribute(attr.name);
    });
  });
}
function referencedIds(root){
  const ids=new Set();
  const re=/#([A-Za-z_][\w:.-]*)/g;
  const all=[root,...root.querySelectorAll('*')];
  all.forEach(el=>{
    [...el.attributes].forEach(attr=>{
      if(!attr.value||attr.value.indexOf('#')===-1)return;
      re.lastIndex=0;
      let m;
      while((m=re.exec(attr.value))){
        try{ids.add(decodeURIComponent(m[1]));}catch(e){ids.add(m[1]);}
      }
    });
    if((el.localName==='style'||el.localName==='script')&&el.textContent&&el.textContent.indexOf('#')!==-1){
      re.lastIndex=0;
      let m;
      while((m=re.exec(el.textContent)))ids.add(m[1]);
    }
  });
  return ids;
}
function hasMeaningfulChild(el){
  for(const n of el.childNodes){
    if(n.nodeType===1||n.nodeType===8)return true;
    if(n.nodeType===3&&n.textContent.trim())return true;
  }
  return false;
}
function removeEmptyGroups(svg){
  const refs=referencedIds(svg);
  for(let guard=0;guard<40;guard++){
    const groups=svg.querySelectorAll('g');
    let removed=false;
    for(let i=groups.length-1;i>=0;i--){
      const g=groups[i];
      if(!g.parentNode)continue;
      const gid=g.getAttribute('id');
      if(gid&&refs.has(gid))continue;
      if(hasMeaningfulChild(g))continue;
      g.remove();
      removed=true;
    }
    if(!removed)break;
  }
}
function roundNums(value,digits){
  const re=/-?(?:\d+\.\d+|\d+|\.\d+)(?:[eE][-+]?\d+)?/g;
  return String(value).replace(re,raw=>{
    const n=Number(raw);
    if(!Number.isFinite(n))return raw;
    const f=Math.pow(10,digits);
    let r=Math.round(n*f)/f;
    if(Object.is(r,-0))r=0;
    if(digits<=0)return String(Math.round(n)===0?0:Math.round(n));
    let s=r.toFixed(digits);
    s=s.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
    if(s==='-0')s='0';
    return s;
  });
}
function roundTree(svg,digits){
  const all=[svg,...svg.querySelectorAll('*')];
  all.forEach(el=>{
    if(el.localName==='style'||el.localName==='script')return;
    if(el.closest&&el.closest('style, script'))return;
    [...el.attributes].forEach(attr=>{
      const name=(attr.localName||attr.name||'').toLowerCase();
      if(!ROUND_ATTR.has(name)||!attr.value)return;
      if(/url\(|#|rgb|hsl/i.test(attr.value))return;
      const next=roundNums(attr.value,digits);
      if(next!==attr.value)attr.value=next;
    });
  });
}
function removeUnusedXlink(svg){
  const XLINK='http://www.w3.org/1999/xlink';
  const all=[svg,...svg.querySelectorAll('*')];
  let used=false;
  for(const el of all){
    for(const attr of el.attributes){
      const name=attr.name||'';
      if(name==='xmlns:xlink')continue;
      if(attr.namespaceURI===XLINK||name.startsWith('xlink:')){used=true;break;}
    }
    if(used)break;
  }
  if(used)return;
  all.forEach(el=>{if(el.hasAttribute('xmlns:xlink'))el.removeAttribute('xmlns:xlink');});
}
function stripWhitespace(root){
  const skip=new Set(['text','tspan','textPath','style','script','title','desc','pre']);
  const owner=root.ownerDocument||document;
  const walker=owner.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const drop=[];
  let node=walker.nextNode();
  while(node){
    const parent=node.parentElement;
    const name=parent&&parent.localName;
    if(parent&&!skip.has(name)&&!String(node.textContent||'').trim())drop.push(node);
    node=walker.nextNode();
  }
  drop.forEach(n=>n.remove());
}
function compactEmpty(xml){
  return xml.replace(/<([A-Za-z][\w:.-]*)((?:\s[^<>]*?)?)\s*>\s*<\/\1>/g,'<$1$2/>');
}
function leadingComments(doc){
  let out='';
  doc.childNodes.forEach(n=>{
    if(n.nodeType===8)out+='<!--'+n.nodeValue+'-->\n';
  });
  return out;
}
function optimizeSvg(input,opts){
  const source=String(input||'').replace(/^\uFEFF/,'');
  const declMatch=source.match(/^\s*<\?xml[\s\S]*?\?>/i);
  const decl=declMatch?declMatch[0].trim():'';
  let text=opts.comments?source.replace(/<!--[\s\S]*?-->/g,''):source;
  const doc=new DOMParser().parseFromString(text,'image/svg+xml');
  const svg=doc.documentElement;
  const rootName=(svg&&svg.localName||'').toLowerCase();
  const parseError=doc.querySelector('parsererror');
  if(!svg||rootName==='parsererror'||rootName!=='svg')throw new Error('parse');
  if(parseError&&parseError.namespaceURI==='http://www.w3.org/1999/xhtml')throw new Error('parse');
  if(opts.editor)stripEditor(svg);
  if(opts.groups)removeEmptyGroups(svg);
  if(opts.round)roundTree(svg,opts.digits);
  if(opts.xlink)removeUnusedXlink(svg);
  if(opts.space)stripWhitespace(svg);
  let out=new XMLSerializer().serializeToString(svg);
  if(opts.space)out=compactEmpty(out);
  if(!opts.comments){
    const pre=leadingComments(doc);
    if(pre)out=pre+out;
  }
  // checked = strip declaration; only re-add when unchecked
  if(!opts.xml&&decl)out=decl+'\n'+out;
  return out;
}
function previewMarkup(svgText){
  try{
    const doc=new DOMParser().parseFromString(svgText,'image/svg+xml');
    const svg=doc.documentElement;
    if(!svg||svg.localName!=='svg')return svgText;
    if(!svg.getAttribute('width')&&svg.getAttribute('viewBox')){
      const p=svg.getAttribute('viewBox').trim().split(/[\s,]+/).map(Number);
      if(p.length===4&&p[2]>0&&p[3]>0){
        svg.setAttribute('width',String(p[2]));
        svg.setAttribute('height',String(p[3]));
      }
    }
    return new XMLSerializer().serializeToString(svg);
  }catch(e){return svgText;}
}
function clearPreview(){
  const img=$('#preview');
  const frame=$('#previewFrame');
  img.onload=null;
  img.onerror=null;
  img.removeAttribute('src');
  img.style.display='none';
  frame.hidden=true;
  frame.removeAttribute('src');
  if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl='';}
}
function setPreview(markup){
  const old=previewUrl;
  const blob=new Blob([previewMarkup(markup)],{type:'image/svg+xml;charset=utf-8'});
  previewUrl=URL.createObjectURL(blob);
  const img=$('#preview');
  const frame=$('#previewFrame');
  frame.hidden=true;
  frame.removeAttribute('src');
  img.style.display='none';
  img.onload=()=>{img.style.display='block';};
  img.onerror=()=>{
    img.style.display='none';
    frame.hidden=false;
    frame.src=previewUrl;
  };
  img.src=previewUrl;
  if(old)URL.revokeObjectURL(old);
}
function paintSavings(){
  if(!hasResult)return;
  const before=lastBefore;
  const after=lastAfter;
  $('#origSize').textContent=formatBytes(before);
  $('#newSize').textContent=formatBytes(after);
  $('#newBox').classList.toggle('saved',after<before);
  $('#newBox').classList.toggle('warn',after>before);
  const pct=before?(before-after)/before*100:0;
  const n=Math.abs(pct).toFixed(1);
  let label=t('same');
  let cls='pos';
  if(pct>=0.05)label=tf('saved',{n:n});
  else if(pct<=-0.05){label=tf('larger',{n:n});cls='neg';}
  const ratio=$('#ratio');
  ratio.textContent='';
  const span=document.createElement('span');
  span.className=cls;
  span.textContent=label;
  ratio.appendChild(span);
}
function showEmpty(){
  hasResult=false;
  optimized='';
  lastBefore=0;
  lastAfter=0;
  clearPreview();
  $('#empty').style.display='';
  $('#stats').style.display='none';
  $('#ratio').textContent='';
  $('#download').disabled=true;
  $('#clear').disabled=!$('#source').value;
  $('#meta').textContent=t('waiting');
}
function showResult(before,after,svg){
  optimized=svg;
  hasResult=true;
  lastBefore=before;
  lastAfter=after;
  $('#stats').style.display='';
  $('#empty').style.display='none';
  $('#download').disabled=false;
  $('#clear').disabled=false;
  $('#meta').textContent=t('ready');
  paintSavings();
  setPreview(svg);
  showBanner('');
}
function showBanner(key){
  const el=$('#libStatus');
  if(!el)return;
  if(!key){el.hidden=true;el.textContent='';delete el.dataset.key;return;}
  el.dataset.key=key;
  el.hidden=false;
  el.textContent=t(key);
}
function run(){
  const id=++runSeq;
  const raw=$('#source').value.replace(/^\uFEFF/,'');
  if(!raw.trim()){showBanner('');showEmpty();return;}
  if(byteLen(raw)>MAX_BYTES){showEmpty();showBanner('errBig');return;}
  if(!/<svg[\s>]/i.test(raw)){showEmpty();showBanner('errType');return;}
  try{
    const out=optimizeSvg(raw,readOpts());
    if(id!==runSeq)return;
    showResult(byteLen(raw),byteLen(out),out);
  }catch(e){
    if(id!==runSeq)return;
    showEmpty();
    showBanner('errParse');
  }
}
function schedule(){
  clearTimeout(schedule.timer);
  schedule.timer=setTimeout(run,160);
}
function applyI18n(){
  const def=LANGS.find(l=>l.code===language)||LANGS[0];
  document.documentElement.lang=language==='zh'?'zh-CN':language;
  document.documentElement.dir=def.dir;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    const value=t(key);
    if(value!==key)el.innerHTML=value;
  });
  document.querySelectorAll('[data-placeholder]').forEach(el=>{
    el.setAttribute('placeholder',t(el.getAttribute('data-placeholder')));
  });
  const frame=$('#previewFrame');
  if(frame)frame.title=t('previewTitle');
  syncOpts();
  const seo=SEO[language]||SEO.en||SEO.zh;
  document.title=seo.title;
  setMeta('name','description',seo.desc);
  setMeta('property','og:title',seo.title);
  setMeta('property','og:description',seo.desc);
  setMeta('name','twitter:title',seo.title);
  setMeta('name','twitter:description',seo.desc);
  const ld=document.querySelector('#ldjson');
  if(ld){
    try{
      const obj=JSON.parse(ld.textContent);
      obj.name=t('title');
      obj.description=seo.desc;
      ld.textContent=JSON.stringify(obj);
    }catch(e){}
  }
  const banner=$('#libStatus');
  if(banner&&!banner.hidden&&banner.dataset.key)banner.textContent=t(banner.dataset.key);
  if(hasResult){
    $('#meta').textContent=t('ready');
    paintSavings();
  }else if(!banner||banner.hidden){
    $('#meta').textContent=t('waiting');
  }
}
function setLanguage(lang){
  if(!knownLang(lang))lang='en';
  language=lang;
  try{localStorage.setItem('language',lang);}catch(e){}
  langSelect.value=language;
  applyI18n();
}
async function loadFile(file){
  if(!file)return;
  if(file.size>MAX_BYTES){showBanner('errBig');return;}
  let text='';
  try{text=await file.text();}catch(e){showBanner('errParse');return;}
  if(!/<svg[\s>]/i.test(text)){showBanner('errType');return;}
  baseName=safeName((file.name||'image').replace(/\.[^.]+$/,''));
  $('#source').value=text;
  $('#clear').disabled=false;
  run();
}
function downloadText(text,name){
  const blob=new Blob([text],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function bindDrop(){
  const drop=$('#drop');
  ['dragenter','dragover'].forEach(type=>{
    drop.addEventListener(type,ev=>{ev.preventDefault();drop.classList.add('over');});
  });
  ['dragleave','drop'].forEach(type=>{
    drop.addEventListener(type,ev=>{ev.preventDefault();drop.classList.remove('over');});
  });
  drop.addEventListener('drop',e=>{
    const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(file){loadFile(file);return;}
    const text=e.dataTransfer&&e.dataTransfer.getData('text/plain');
    if(text){$('#source').value=text;baseName='image';$('#clear').disabled=false;run();}
  });
}
$('#file').addEventListener('change',e=>{
  if(e.target.files&&e.target.files[0])loadFile(e.target.files[0]);
});
bindDrop();
$('#opts').addEventListener('input',e=>{
  const id=e.target&&e.target.id;
  if(id==='source'){baseName='image';$('#clear').disabled=!e.target.value;schedule();}
  if(id==='decimals'){syncOpts();schedule();}
});
$('#opts').addEventListener('change',e=>{
  const id=e.target&&e.target.id;
  if(!id||id==='source')return;
  syncOpts();
  schedule();
});
document.addEventListener('paste',e=>{
  const target=e.target;
  if(target&&target.id==='source')return;
  const text=e.clipboardData&&e.clipboardData.getData('text/plain');
  if(text&&/<svg[\s>]/i.test(text)){
    $('#source').value=text;
    baseName='image';
    $('#clear').disabled=false;
    run();
    e.preventDefault();
  }
});
$('#download').addEventListener('click',()=>{
  if($('#download').disabled||!optimized)return;
  downloadText(optimized,safeName(baseName)+'-opt.svg');
});
$('#clear').addEventListener('click',()=>{
  runSeq++;
  $('#source').value='';
  $('#file').value='';
  baseName='image';
  showBanner('');
  showEmpty();
});
langSelect.addEventListener('change',()=>setLanguage(langSelect.value));
syncOpts();
setLanguage(language);
(function watchCards(){
  const grid=document.querySelector('[data-tool-cards]');
  if(!grid)return;
  const fix=()=>{
    grid.querySelectorAll('[data-i18n]').forEach(el=>{
      const key=el.getAttribute('data-i18n');
      const value=t(key);
      if(value!==key&&el.textContent!==value)el.textContent=value;
    });
  };
  new MutationObserver(fix).observe(grid,{childList:true,subtree:true});
})();
document.addEventListener('DOMContentLoaded',applyI18n);
