<script>
(function () {
  var LANGS = [
    {code:"zh",name:"中文",dir:"ltr"},
    {code:"en",name:"English",dir:"ltr"},
    {code:"ja",name:"日本語",dir:"ltr"},
    {code:"ko",name:"한국어",dir:"ltr"},
    {code:"es",name:"Español",dir:"ltr"},
    {code:"fr",name:"Français",dir:"ltr"},
    {code:"de",name:"Deutsch",dir:"ltr"},
    {code:"ru",name:"Русский",dir:"ltr"},
    {code:"pt",name:"Português",dir:"ltr"},
    {code:"ar",name:"العربية",dir:"rtl"},
    {code:"vi",name:"Tiếng Việt",dir:"ltr"},
    {code:"id",name:"Bahasa Indonesia",dir:"ltr"},
    {code:"th",name:"ไทย",dir:"ltr"}
  ];
  var LANG_SET = {};
  LANGS.forEach(function (item) { LANG_SET[item.code] = item; });

  function detectLang() {
    try {
      var param = new URL(location.href).searchParams.get("lang");
      if (param && LANG_SET[param]) return param;
    } catch (e) {}
    try {
      var saved = localStorage.getItem("language");
      if (saved && LANG_SET[saved]) return saved;
    } catch (e2) {}
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
    for (var i = 0; i < list.length; i++) {
      var code = String(list[i] || "").toLowerCase().slice(0, 2);
      if (code === "zh") return "zh";
      if (LANG_SET[code]) return code;
    }
    return "en";
  }

  function applyLang(code) {
    var item = LANG_SET[code] || LANG_SET.en;
    try { localStorage.setItem("language", item.code); } catch (e) {}
    document.documentElement.lang = item.code === "zh" ? "zh-CN" : item.code;
    document.documentElement.dir = item.dir;
  }

  var sel = document.getElementById("langSelect");
  if (sel) {
    var lang = detectLang();
    applyLang(lang);
    LANGS.forEach(function (item) {
      var opt = document.createElement("option");
      opt.value = item.code;
      opt.textContent = item.name;
      sel.appendChild(opt);
    });
    sel.value = lang;
    sel.addEventListener("change", function () {
      applyLang(sel.value);
      if (window.imagecApplyChrome) window.imagecApplyChrome();
    });
  }
})();
(function () {
  var list = document.getElementById("sponsorWall");
  var empty = document.getElementById("wallEmpty");
  if (!list || !empty) return;

  function clearWall() {
    while (list.firstChild) list.removeChild(list.firstChild);
  }

  function showEmpty() {
    clearWall();
    empty.hidden = false;
  }

  function showNames(names) {
    clearWall();
    for (var i = 0; i < names.length; i++) {
      var li = document.createElement("li");
      li.textContent = names[i];
      list.appendChild(li);
    }
    empty.hidden = true;
  }

  fetch("/sponsors.json")
    .then(function (res) {
      if (!res.ok) throw new Error("status");
      return res.json();
    })
    .then(function (data) {
      var rows = data && Array.isArray(data.sponsors) ? data.sponsors : [];
      var names = [];
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        if (!row || typeof row.name !== "string") continue;
        var name = row.name.trim();
        if (name) names.push(name);
      }
      if (!names.length) showEmpty();
      else showNames(names);
    })
    .catch(function () {
      showEmpty();
    });
})();
</script>
