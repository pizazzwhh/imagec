function detectLang(){
  const param=new URL(location.href).searchParams.get('lang');
  if(param&&messages[param])return param;
  let saved='';
  try{saved=localStorage.getItem('language')||'';}catch(e){}
  if(saved&&messages[saved])return saved;
  const navLangs=navigator.languages||[navigator.language||'zh'];
  for(const l of navLangs){
    const lc=String(l).toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    const code=lc.slice(0,2);
    if(messages[code])return code;
  }
  return 'zh';
}

  if(messages.zh&&messages.zh[key]!=null)return messages.zh[key];
  return key;
}
function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}
function readHeic(){
  const lib=window.heic2any;
  if(typeof lib==='function')return lib;
  if(lib&&typeof lib.default==='function')return lib.default;
  return null;
}
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    let settled=false;
    const timer=setTimeout(()=>finish(new Error('timeout')),8000);
    function finish(err){
      if(settled)return;
      settled=true;
      clearTimeout(timer);
      s.onload=s.onerror=null;
      if(err){s.remove();reject(err);}
      else resolve();
    }
    s.src=src;
    s.async=true;
    s.onload=()=>finish();
    s.onerror=()=>finish(new Error('load failed'));
    document.head.appendChild(s);
  });
}
function ensureHeic(){
  const found=readHeic();
  if(found)return Promise.resolve(found);
  if(!heicPromise){
    heicPromise=(async()=>{
      const primary=document.getElementById('heicLib');
      const ready=await new Promise(resolve=>{
        let done=false;
        const finish=()=>{
          if(done)return;
          done=true;
          clearInterval(timer);
          resolve(readHeic());
        };
        if(primary){
          primary.addEventListener('load',finish);
          primary.addEventListener('error',finish);
        }
        const timer=setInterval(()=>{if(readHeic())finish();},50);
        setTimeout(finish,8000);
      });
      if(ready)return ready;
      for(const src of HEIC_FALLBACKS){
        try{
          await loadScript(src);
          const lib=readHeic();
          if(lib)return lib;
        }catch(e){}
      }
      return null;
    })();
  }
  return heicPromise.then(lib=>{
    if(!lib)heicPromise=null;
    return lib;
  });
}
function applyI18n(){
  const def=LANGS.find(l=>l.code===language)||LANGS[0];
  document.documentElement.lang=language==='zh'?'zh-CN':language;
  document.documentElement.dir=def.dir;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    const value=t(key);
    if(value!==key)el.innerHTML=value;
  });
  const q=$('#quality');
  if(q)$('#qualityV').textContent=q.value;
  const seo=SEO[language]||SEO.en||SEO.zh;
  document.title=seo.title;
  setMeta('name','description',seo.desc);
  setMeta('property','og:title',seo.title);
  setMeta('property','og:description',seo.desc);
  setMeta('name','twitter:title',seo.title);
  setMeta('name','twitter:description',seo.desc);
  const ld=document.querySelector('#ldjson');
  if(ld){
    try{
      const obj=JSON.parse(ld.textContent);
      obj.name=t('title');
      obj.description=seo.desc;
      ld.textContent=JSON.stringify(obj);
    }catch(e){}
  }
  const wrap=$('#wrap');
  if(wrap)wrap.setAttribute('data-loading',t('working'));
  paintMeta();
  const banner=$('#libStatus');
  if(banner&&!banner.hidden&&banner.dataset.key)banner.textContent=t(banner.dataset.key);
}
function setLanguage(lang){
  if(!messages[lang])lang='en';
  language=lang;
  try{localStorage.setItem('language',lang);}catch(e){}
  langSelect.value=language;
  applyI18n();
}
function showBanner(key){
  const el=$('#libStatus');
  if(!el)return;
  if(!key){el.hidden=true;el.textContent='';delete el.dataset.key;return;}
  el.dataset.key=key;
  el.hidden=false;
  el.textContent=t(key);
}
function formatBytes(n){
  n=Number(n)||0;
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
function isHeic(file){
  const name=(file.name||'').toLowerCase();
  const type=(file.type||'').toLowerCase();
  if(type.indexOf('heic')!==-1||type.indexOf('heif')!==-1)return true;
  return name.endsWith('.heic')||name.endsWith('.heif');
}
function loadImage(blob){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(blob);
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('load'));};
    img.src=url;
  });
}
function paintMeta(){
  const meta=$('#meta');
  if(!meta)return;
  if(status==='working'){meta.textContent=t('working');return;}
  if(status==='ready'&&source){
    let text=t('ready').replace('{w}',String(canvas.width)).replace('{h}',String(canvas.height));
    if(scaled)text+=' · '+t('scaled');
    if(multi)text+=' · '+t('multi');
    meta.textContent=text;
    return;
  }
  meta.textContent=t('waiting');
}
function syncFmt(){
  $('#fmtSeg').querySelectorAll('button').forEach(btn=>{
    btn.classList.toggle('active',btn.getAttribute('data-fmt')===fmt);
  });
  const lossy=fmt==='jpeg';
  $('#qualityGroup').style.display=lossy?'':'none';
  $('#jpgNote').style.display=fmt==='jpeg'?'':'none';
}
function setBusy(on){
  document.body.classList.toggle('computing',!!on);
  $('#wrap').setAttribute('data-loading',t('working'));
}
function showEmpty(){
  source=null;
  outputBlob=null;
  multi=false;
  scaled=false;
  status='empty';
  setBusy(false);
  canvas.width=0;
  canvas.height=0;
  canvas.style.display='none';
  $('#empty').style.display='';
  $('#download').disabled=true;
  $('#clear').disabled=true;
  $('#stats').style.display='none';
  $('#file').value='';
  paintMeta();
}
function showWorking(){
  status='working';
  outputBlob=null;
  $('#empty').style.display='none';
  canvas.style.display='none';
  $('#download').disabled=true;
  $('#clear').disabled=false;
  $('#stats').style.display='none';
  setBusy(true);
  paintMeta();
}
function renderPreview(){
  const edge=Math.max(source.naturalWidth,source.naturalHeight)||1;
  const scale=edge>MAX_EDGE?MAX_EDGE/edge:1;
  scaled=scale<1;
  const w=Math.max(1,Math.round(source.naturalWidth*scale));
  const h=Math.max(1,Math.round(source.naturalHeight*scale));
  canvas.width=w;
  canvas.height=h;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(source,0,0,w,h);
  status='ready';
  setBusy(false);
  canvas.style.display='block';
  $('#empty').style.display='none';
  $('#clear').disabled=false;
  paintMeta();
}
function makeBlob(){
  return new Promise(resolve=>{
    if(!canvas.width||!canvas.height){resolve(null);return;}
    const mime=fmt==='png'?'image/png':'image/jpeg';
    const q=(parseInt($('#quality').value,10)||85)/100;
    let target=canvas;
    if(mime==='image/jpeg'){
      const off=document.createElement('canvas');
      off.width=canvas.width;
      off.height=canvas.height;
      const o=off.getContext('2d');
      o.fillStyle='#ffffff';
      o.fillRect(0,0,off.width,off.height);
      o.drawImage(canvas,0,0);
      target=off;
    }
    try{
      target.toBlob(blob=>resolve(blob),mime,mime==='image/png'?undefined:q);
    }catch(e){resolve(null);}
  });
}
function scheduleMeasure(){
  clearTimeout(scheduleMeasure.timer);
  scheduleMeasure.timer=setTimeout(runMeasure,80);
}
async function runMeasure(){
  const id=++measureSeq;
  $('#download').disabled=true;
  const blob=await makeBlob();
  if(id!==measureSeq||status!=='ready')return;
  if(!blob){showBanner('errExport');return;}
  showBanner('');
  outputBlob=blob;
  $('#origSize').textContent=formatBytes(originalSize);
  $('#newSize').textContent=formatBytes(blob.size);
  $('#newBox').classList.toggle('saved',blob.size<=originalSize);
  $('#stats').style.display='';
  $('#download').disabled=false;
  $('#clear').disabled=false;
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function decodeFile(file){
  const lib=await ensureHeic();
  if(!lib){
    try{return {img:await loadImage(file),many:false};}
    catch(e){throw new Error('lib');}
  }
  try{
    const out=await lib({blob:file,toType:'image/png'});
    const blob=Array.isArray(out)?out[0]:out;
    const many=Array.isArray(out)&&out.length>1;
    if(!blob)throw new Error('empty');
    return {blob,many};
  }catch(e){
    try{return {img:await loadImage(file),many:false};}
    catch(e2){throw new Error('convert');}
  }
}
async function load(file){
  if(!file)return;
  if(!isHeic(file)){showBanner('errType');return;}
  const id=++seq;
  showBanner('');
  showWorking();
  try{
    const decoded=await decodeFile(file);
    if(id!==seq)return;
    const img=decoded.img||await loadImage(decoded.blob);
    if(id!==seq)return;
    source=img;
    originalSize=file.size||0;
    baseName=(file.name||'image').replace(/\.[^.]+$/,'')||'image';
    multi=!!decoded.many;
    renderPreview();
    scheduleMeasure();
  }catch(e){
    if(id!==seq)return;
    showEmpty();
    showBanner(e&&e.message==='lib'?'errLib':'errConvert');
  }
}
$('#file').addEventListener('change',e=>{
  if(e.target.files&&e.target.files[0])load(e.target.files[0]);
});
['dragenter','dragover'].forEach(type=>{
  $('#drop').addEventListener(type,e=>{e.preventDefault();$('#drop').classList.add('over');});
});
['dragleave','drop'].forEach(type=>{
  $('#drop').addEventListener(type,e=>{e.preventDefault();$('#drop').classList.remove('over');});
});
$('#drop').addEventListener('drop',e=>{
  const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(file)load(file);
});
document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(const item of items){
    if(item.kind==='file'){
      const file=item.getAsFile();
      if(file){load(file);break;}
    }
  }
});
$('#fmtSeg').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-fmt]');
  if(!btn)return;
  fmt=btn.getAttribute('data-fmt');
  syncFmt();
  if(source)scheduleMeasure();
});
$('#quality').addEventListener('input',()=>{
  $('#qualityV').textContent=$('#quality').value;
  if(source)scheduleMeasure();
});
$('#clear').addEventListener('click',()=>{seq++;measureSeq++;showBanner('');showEmpty();});
$('#download').addEventListener('click',()=>{
  if($('#download').disabled||!outputBlob)return;
  const ext=fmt==='png'?'png':'jpg';
  downloadBlob(outputBlob,baseName+'-heic.'+ext);
});
langSelect.addEventListener('change',()=>setLanguage(langSelect.value));
syncFmt();
setLanguage(language);
(function watchCards(){
  const grid=document.querySelector('[data-tool-cards]');
  if(!grid)return;
  const fix=()=>{
    grid.querySelectorAll('[data-i18n]').forEach(el=>{
      const key=el.getAttribute('data-i18n');
      const value=t(key);
      if(value!==key&&el.textContent!==value)el.textContent=value;
    });
  };
  new MutationObserver(fix).observe(grid,{childList:true,subtree:true});
})();
document.addEventListener('DOMContentLoaded',applyI18n);
