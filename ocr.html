<script>
(function(){
  var TESS_FALLBACKS=[
    'https://fastly.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',
    'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js'
  ];
  function loadScript(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement('script');
      var done=false;
      var t=setTimeout(function(){finish(new Error('timeout'));},8000);
      function finish(err){
        if(done)return; done=true; clearTimeout(t);
        s.onload=s.onerror=null;
        if(err){s.remove();reject(err);} else resolve();
      }
      s.src=src; s.async=true;
      s.onload=function(){finish();};
      s.onerror=function(){finish(new Error('fail'));};
      document.head.appendChild(s);
    });
  }
  window.ensureTesseract=async function(){
    if(typeof Tesseract!=='undefined')return Tesseract;
    for(var i=0;i<TESS_FALLBACKS.length;i++){
      try{
        await loadScript(TESS_FALLBACKS[i]);
        if(typeof Tesseract!=='undefined')return Tesseract;
      }catch(e){}
    }
    return null;
  };
})();
</script>

function kindOf(file){

  if(type==='image/png'||name.endsWith('.png'))return 'png';
  if(type==='image/jpeg'||type==='image/jpg'||name.endsWith('.jpg')||name.endsWith('.jpeg'))return 'jpeg';
  if(type==='image/webp'||name.endsWith('.webp'))return 'webp';
  return '';

    const url=URL.createObjectURL(blob);
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('load'));};
    img.src=url;
  });

  if(!OCR_LANG[lang])lang='chi_sim+eng';
  if(worker&&workerLang===lang)return worker;
  if(worker&&typeof worker.reinitialize==='function'){
    try{
      await worker.reinitialize(lang);
      if(gen!==workerGen)throw new Error('abort');
      workerLang=lang;
      return worker;
    }catch(e){
      if(e&&e.message==='abort')throw e;
      try{if(worker)await worker.terminate();}catch(err){}
      worker=null;
      workerLang='';
    }
  }else if(worker){
    try{await worker.terminate();}catch(e){}
    worker=null;
    workerLang='';
  }
  if(gen!==workerGen)throw new Error('abort');
  const created=await Tesseract.createWorker(lang,1,{logger:onLogger});
  if(gen!==workerGen){
    try{await created.terminate();}catch(e){}
    throw new Error('abort');
  }
  worker=created;
  workerLang=lang;
  return created;
}
function drawPreview(img){
  const edge=Math.max(img.naturalWidth,img.naturalHeight)||1;
  const scale=edge>1600?1600/edge:1;
  const w=Math.max(1,Math.round(img.naturalWidth*scale));
  const h=Math.max(1,Math.round(img.naturalHeight*scale));
  canvas.width=w;
  canvas.height=h;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);
  canvas.style.display='block';
}
function prepareSource(img,file){
  const edge=Math.max(img.naturalWidth,img.naturalHeight)||1;
  if(edge<=2400)return file;
  const scale=2400/edge;
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.naturalWidth*scale));
  c.height=Math.max(1,Math.round(img.naturalHeight*scale));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c;
}
function countChars(text){return Array.from(text||'').length;}
function applyText(res){
  const text=String(res&&res.data&&res.data.text||'').replace(/\s+$/,'');
  $('#output').value=text;
  busy=false;
  state='ready';
  lastLog=null;
  hideProgress();
  lastSize.n=countChars(text);
  const has=text.length>0;
  $('#copy').disabled=!has;
  $('#download').disabled=!has;
  $('#clear').disabled=false;
  showBanner('');
  paintMeta();
}
function failKey(err){
  const msg=String(err&&(err.message||err)||'');
  if(msg==='abort')return '';
  if(msg==='lib'||/createWorker|tesseract/i.test(msg)&&/not defined|undefined/i.test(msg))return 'errLib';
  if(/fetch|network|NetworkError|Failed to load|lang\.traineddata|Import/i.test(msg))return 'errNet';
  return 'errFail';
}
function recognize(file){
  const id=++seq;
  const lang=OCR_LANG[ocrLang]?ocrLang:'chi_sim+eng';
  const gen=workerGen;
  busy=true;
  state='working';
  lastLog=null;
  $('#output').value='';
  $('#copy').disabled=true;
  $('#download').disabled=true;
  $('#clear').disabled=false;
  hideProgress();
  paintMeta();
  showBanner('');
  withLock(async()=>{
    if(id!==seq||gen!==workerGen)return;
    logSeq=id;
    const w=await ensureWorkerBody(lang,gen);
    if(id!==seq||gen!==workerGen)return;
    let res;
    try{
      res=await w.recognize(file);
    }catch(err){
      if(id!==seq||gen!==workerGen)return;
      if(!canvas.width)throw err;
      res=await w.recognize(canvas);
    }
    if(id!==seq||gen!==workerGen)return;
    applyText(res);
  }).catch(err=>{
    if(id!==seq||gen!==workerGen)return;
    busy=false;
    lastLog=null;
    hideProgress();
    state='error';
    const key=failKey(err);
    if(key)showBanner(key);
    $('#meta').textContent=key?t(key):t('waiting');
  });
}
function showEmpty(){
  sourceFile=null;
  sourceImg=null;
  busy=false;
  state='empty';
  lastLog=null;
  logSeq=0;
  lastSize={w:0,h:0,n:0};
  canvas.width=0;
  canvas.height=0;
  canvas.style.display='none';
  $('#output').value='';
  $('#empty').style.display='';
  $('#copy').disabled=true;
  $('#download').disabled=true;
  $('#clear').disabled=true;
  $('#file').value='';
  hideProgress();
  paintMeta();
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function copyText(){
  const text=$('#output').value;
  if(!text)return;
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(text);
    else{
      $('#output').focus();
      $('#output').select();
      if(!document.execCommand('copy'))throw new Error('copy');
    }
    const btn=$('#copy');
    btn.textContent=t('copied');
    setTimeout(()=>{btn.textContent=t('copy');},1600);
    showBanner('');
  }catch(e){
    showBanner('errCopy');
  }
}
async function load(file){
  if(!file)return;
  const kind=kindOf(file);
  if(kind==='heic'){showBanner('errHeic');return;}
  if(kind!=='png'&&kind!=='jpeg'&&kind!=='webp'){showBanner('errType');return;}
  const id=++seq;
  showBanner('');
  try{
    const img=await loadImage(file);
    if(id!==seq)return;
    sourceFile=file;
    sourceImg=img;
    baseName=safeName((file.name||'image').replace(/\.[^.]+$/,''));
    lastSize.w=img.naturalWidth||0;
    lastSize.h=img.naturalHeight||0;
    drawPreview(img);
    $('#empty').style.display='none';
    $('#clear').disabled=false;
    recognize(prepareSource(img,file));
  }catch(e){
    if(id!==seq)return;
    showEmpty();
    showBanner('errLoad');
  }
}
function bindDrop(){
  const drop=$('#drop');
  ['dragenter','dragover'].forEach(type=>{
    drop.addEventListener(type,ev=>{ev.preventDefault();drop.classList.add('over');});
  });
  ['dragleave','drop'].forEach(type=>{
    drop.addEventListener(type,ev=>{ev.preventDefault();drop.classList.remove('over');});
  });
  drop.addEventListener('drop',e=>{
    const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(file)load(file);
  });
}
$('#file').addEventListener('change',e=>{
  if(e.target.files&&e.target.files[0])load(e.target.files[0]);
});
bindDrop();
document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(const item of items){
    if(item.type&&item.type.indexOf('image/')===0){
      const file=item.getAsFile();
      if(file){load(file);break;}
    }
  }
});
$('#langSeg').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-lang]');
  if(!btn)return;
  const next=btn.getAttribute('data-lang');
  if(!OCR_LANG[next])return;
  const same=next===ocrLang;
  ocrLang=next;
  syncLang();
  if(!sourceFile||!sourceImg)return;
  if(same&&state==='ready'&&$('#output').value)return;
  recognize(prepareSource(sourceImg,sourceFile));
});
$('#output').addEventListener('input',()=>{
  if(state!=='ready'&&state!=='error')state='ready';
  const text=$('#output').value;
  lastSize.n=countChars(text);
  const has=text.length>0;
  $('#copy').disabled=!has;
  $('#download').disabled=!has;
  if(!busy)paintMeta();
});
$('#copy').addEventListener('click',()=>{if(!$('#copy').disabled)copyText();});
$('#download').addEventListener('click',()=>{
  const text=$('#output').value;
  if($('#download').disabled||!text)return;
  downloadBlob(new Blob([text],{type:'text/plain;charset=utf-8'}),safeName(baseName)+'-ocr.txt');
});
$('#clear').addEventListener('click',()=>{
  seq++;
  workerGen++;
  const w=worker;
  worker=null;
  workerLang='';
  showBanner('');
  showEmpty();
  if(w)w.terminate().catch(()=>{});
});
langSelect.addEventListener('change',()=>setLanguage(langSelect.value));
setLanguage(language);
if(window.ensureTesseract){window.ensureTesseract().then(function(T){if(!T)showBanner('errLib');});}else if(typeof Tesseract==='undefined')showBanner('errLib');
(function watchCards(){
  const grid=document.querySelector('[data-tool-cards]');
  if(!grid)return;
  const fix=()=>{
    grid.querySelectorAll('[data-i18n]').forEach(el=>{
      const key=el.getAttribute('data-i18n');
      const value=t(key);
      if(value!==key&&el.textContent!==value)el.textContent=value;
    });
  };
  new MutationObserver(fix).observe(grid,{childList:true,subtree:true});
})();
document.addEventListener('DOMContentLoaded',applyI18n);
