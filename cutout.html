const LIB_URLS=[
  'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm',
  'https://fastly.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm',
  'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm'
];
let language=detectLang();
let sourceFile=null;
let resultBlob=null;
let baseName='image';
let viewW=0;
let viewH=0;
let status='empty';
let seq=0;
let runId=0;
let libPromise=null;
const MAX_EDGE=4096;
const canvas=$('#canvas');
const ctx=canvas.getContext('2d');
const langSelect=$('#langSelect');
LANGS.forEach(l=>{
  const opt=document.createElement('option');
  opt.value=l.code;
  opt.textContent=l.name;
  langSelect.appendChild(opt);
});
function detectLang(){
  const param=new URL(location.href).searchParams.get('lang');
  if(param&&messages[param])return param;
  let saved='';
  try{saved=localStorage.getItem('language')||'';}catch(e){}
  if(saved&&messages[saved])return saved;
  const navLangs=navigator.languages||[navigator.language||'zh'];
  for(const l of navLangs){
    const lc=String(l).toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    const code=lc.slice(0,2);
    if(messages[code])return code;
  }
  return 'zh';
}
function t(key){
  const pack=messages[language]||messages.en||messages.zh;
  if(pack&&pack[key]!=null)return pack[key];
  if(messages.en&&messages.en[key]!=null)return messages.en[key];
  if(messages.zh&&messages.zh[key]!=null)return messages.zh[key];
  return key;
}
function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}
function pickRemove(mod){
  if(!mod)return null;
  if(typeof mod.removeBackground==='function')return mod.removeBackground;
  if(typeof mod.default==='function')return mod.default;
  if(mod.default&&typeof mod.default.removeBackground==='function')return mod.default.removeBackground;
  return null;
}
function ensureLib(){
  if(!libPromise){
    libPromise=(async()=>{
      for(const url of LIB_URLS){
        try{
          const mod=await import(url);
          const fn=pickRemove(mod);
          if(fn)return fn;
        }catch(e){}
      }
      return null;
    })();
  }
  return libPromise.then(fn=>{
    if(!fn)libPromise=null;
    return fn;
  });
}
function applyI18n(){
  const def=LANGS.find(l=>l.code===language)||LANGS[0];
  document.documentElement.lang=language==='zh'?'zh-CN':language;
  document.documentElement.dir=def.dir;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    const value=t(key);
    if(value!==key)el.innerHTML=value;
  });
  const seo=SEO[language]||SEO.en||SEO.zh;
  document.title=seo.title;
  setMeta('name','description',seo.desc);
  setMeta('property','og:title',seo.title);
  setMeta('property','og:description',seo.desc);
  setMeta('name','twitter:title',seo.title);
  setMeta('name','twitter:description',seo.desc);
  const ld=document.querySelector('#ldjson');
  if(ld){
    try{
      const obj=JSON.parse(ld.textContent);
      obj.name=t('title');
      obj.description=seo.desc;
      ld.textContent=JSON.stringify(obj);
    }catch(e){}
  }
  const wrap=$('#wrap');
  if(wrap)wrap.setAttribute('data-loading',t('working'));
  paintMeta();
  const banner=$('#libStatus');
  if(banner&&!banner.hidden&&banner.dataset.key)banner.textContent=t(banner.dataset.key);
}
function setLanguage(lang){
  if(!messages[lang])lang='en';
  language=lang;
  try{localStorage.setItem('language',lang);}catch(e){}
  langSelect.value=language;
  applyI18n();
}
function showBanner(key){
  const el=$('#libStatus');
  if(!el)return;
  if(!key){el.hidden=true;el.textContent='';delete el.dataset.key;return;}
  el.dataset.key=key;
  el.hidden=false;
  el.textContent=t(key);
}
function setProgress(text){
  const el=$('#progress');
  if(!el)return;
  if(!text){el.hidden=true;el.textContent='';return;}
  el.hidden=false;
  el.textContent=text;
}
function isAllowed(file){
  const type=(file.type||'').toLowerCase();
  const name=(file.name||'').toLowerCase();
  if(type==='image/png'||type==='image/jpeg'||type==='image/webp')return true;
  return name.endsWith('.png')||name.endsWith('.jpg')||name.endsWith('.jpeg')||name.endsWith('.webp');
}
function loadImage(blob){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(blob);
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('load'));};
    img.src=url;
  });
}
function paintMeta(){
  const meta=$('#meta');
  if(!meta)return;
  if(status==='working'){
    meta.textContent=$('#progress').textContent||t('working');
    return;
  }
  if((status==='ready'||status==='done')&&viewW&&viewH){
    meta.textContent=t('ready').replace('{w}',String(viewW)).replace('{h}',String(viewH));
    return;
  }
  meta.textContent=t('waiting');
}
function setBusy(on){
  document.body.classList.toggle('computing',!!on);
  $('#wrap').setAttribute('data-loading',t('working'));
}
function drawImage(img){
  viewW=img.naturalWidth||img.width||0;
  viewH=img.naturalHeight||img.height||0;
  const edge=Math.max(viewW,viewH)||1;
  const scale=edge>MAX_EDGE?MAX_EDGE/edge:1;
  const w=Math.max(1,Math.round(viewW*scale));
  const h=Math.max(1,Math.round(viewH*scale));
  canvas.width=w;
  canvas.height=h;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(img,0,0,w,h);
}
function showEmpty(){
  sourceFile=null;
  resultBlob=null;
  viewW=0;
  viewH=0;
  status='empty';
  setBusy(false);
  setProgress('');
  canvas.width=0;
  canvas.height=0;
  canvas.style.display='none';
  $('#empty').style.display='';
  $('#process').disabled=true;
  $('#download').disabled=true;
  $('#clear').disabled=true;
  $('#file').value='';
  paintMeta();
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function load(file){
  if(!file)return;
  if(!isAllowed(file)){showBanner('errType');return;}
  const id=++seq;
  runId++;
  showBanner('');
  setProgress('');
  setBusy(false);
  try{
    const img=await loadImage(file);
    if(id!==seq)return;
    sourceFile=file;
    resultBlob=null;
    baseName=(file.name||'image').replace(/\.[^.]+$/,'')||'image';
    drawImage(img);
    status='ready';
    canvas.style.display='block';
    $('#empty').style.display='none';
    $('#process').disabled=false;
    $('#download').disabled=true;
    $('#clear').disabled=false;
    paintMeta();
  }catch(e){
    if(id!==seq)return;
    showEmpty();
    showBanner('errLoad');
  }
}
async function processFile(){
  if(!sourceFile||$('#process').disabled)return;
  const id=++runId;
  const file=sourceFile;
  showBanner('');
  status='working';
  $('#process').disabled=true;
  $('#download').disabled=true;
  $('#clear').disabled=false;
  setBusy(true);
  setProgress(t('working'));
  paintMeta();
  try{
    const remove=await ensureLib();
    if(id!==runId)return;
    if(!remove){
      status='ready';
      setBusy(false);
      setProgress('');
      $('#process').disabled=false;
      showBanner('errLib');
      paintMeta();
      return;
    }
    const blob=await remove(file,{
      model:'small',
      device:'cpu',
      proxyToWorker:false,
      output:{format:'image/png',quality:1},
      progress:(key,current,total)=>{
        if(id!==runId)return;
        const pct=total?Math.min(100,Math.round(current/total*100)):0;
        const model=String(key).indexOf('/models/')!==-1;
        const text=(model?t('progressModel'):t('progressWasm')).replace('{n}',String(pct));
        setProgress(text);
        const meta=$('#meta');
        if(meta)meta.textContent=text;
      }
    });
    if(id!==runId)return;
    if(!blob)throw new Error('empty');
    const img=await loadImage(blob);
    if(id!==runId)return;
    resultBlob=blob;
    drawImage(img);
    status='done';
    setBusy(false);
    setProgress('');
    canvas.style.display='block';
    $('#empty').style.display='none';
    $('#process').disabled=false;
    $('#download').disabled=false;
    $('#clear').disabled=false;
    paintMeta();
  }catch(e){
    if(id!==runId)return;
    status=sourceFile?'ready':'empty';
    setBusy(false);
    setProgress('');
    $('#process').disabled=!sourceFile;
    const msg=String((e&&e.message)||e||'');
    showBanner(/Failed to fetch|onnxruntime|publicPath|Resource metadata|dynamically imported|import/i.test(msg)?'errLib':'errRun');
    paintMeta();
  }
}
$('#file').addEventListener('change',e=>{
  if(e.target.files&&e.target.files[0])load(e.target.files[0]);
});
['dragenter','dragover'].forEach(type=>{
  $('#drop').addEventListener(type,e=>{e.preventDefault();$('#drop').classList.add('over');});
});
['dragleave','drop'].forEach(type=>{
  $('#drop').addEventListener(type,e=>{e.preventDefault();$('#drop').classList.remove('over');});
});
$('#drop').addEventListener('drop',e=>{
  const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(file)load(file);
});
document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(const item of items){
    if(item.type&&item.type.indexOf('image/')===0){
      const file=item.getAsFile();
      if(file){load(file);break;}
    }
  }
});

  downloadBlob(resultBlob,baseName+'-cutout.png');
});

(function watchCards(){
  const grid=document.querySelector('[data-tool-cards]');
  if(!grid)return;
  const fix=()=>{
    grid.querySelectorAll('[data-i18n]').forEach(el=>{
      const key=el.getAttribute('data-i18n');
      const value=t(key);
      if(value!==key&&el.textContent!==value)el.textContent=value;
    });
  };
  new MutationObserver(fix).observe(grid,{childList:true,subtree:true});
})();
