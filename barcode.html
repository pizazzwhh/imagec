<script>
(function(){
  var BARCODE_FALLBACKS=[
    'https://fastly.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js',
    'https://unpkg.com/jsbarcode@3.11.6/dist/JsBarcode.all.min.js'
  ];
  function loadScript(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement('script');
      var done=false;
      var t=setTimeout(function(){finish(new Error('timeout'));},8000);
      function finish(err){
        if(done)return; done=true; clearTimeout(t);
        s.onload=s.onerror=null;
        if(err){s.remove();reject(err);} else resolve();
      }
      s.src=src; s.async=true;
      s.onload=function(){finish();};
      s.onerror=function(){finish(new Error('fail'));};
      document.head.appendChild(s);
    });
  }
  window.ensureJsBarcode=async function(){
    if(typeof JsBarcode==='function')return JsBarcode;
    for(var i=0;i<BARCODE_FALLBACKS.length;i++){
      try{
        await loadScript(BARCODE_FALLBACKS[i]);
        if(typeof JsBarcode==='function')return JsBarcode;
      }catch(e){}
    }
    return null;
  };
})();
</script>

  en:{title:'Barcode generator | CODE128, EAN, UPC | imagec',desc:'Make a CODE128, EAN-13, EAN-8, UPC, or CODE39 barcode in the browser and download a PNG. Height, bar width, margin, and colors are adjustable. Generated locally — nothing is uploaded.'}

  zh:{title:'生成条形码',subtitle:'生成 CODE128、EAN 等条形码 PNG。',privacy:'本地处理 · 不上传服务器',format:'格式',textLabel:'内容',height:'高度',width:'条宽',margin:'边距',showText:'显示文字',fg:'前景色',bg:'背景色',download:'下载 PNG',clear:'清空',emptyTitle:'输入内容，生成条形码',waiting:'等待内容',ready:'{fmt} · {w}×{h}',ph128:'imagec',phEan13:'6901234567892',phEan8:'96385074',phUpc:'036000291452',ph39:'IMAGEC',hint128:'数字、字母和常见符号都可以。',hintEan13:'13 位数字，最后一位是校验码。',hintEan8:'8 位数字，最后一位是校验码。',hintUpc:'12 位数字，最后一位是校验码。',hint39:'数字、大写字母，以及 - . 空格 $ / + %。',errEan13:'EAN-13 需要 13 位数字，并且最后一位校验码要正确。',errEan8:'EAN-8 需要 8 位数字，并且最后一位校验码要正确。',errUpc:'UPC 需要 12 位数字，并且最后一位校验码要正确。',errCode39:'CODE39 只支持数字、大写字母和 - . 空格 $ / + %。',errInvalid:'这段内容不能生成该格式的条形码。',errLib:'条形码组件加载失败。请检查网络，或允许 jsDelivr 后刷新页面。',moreTools:'更多图片工具',linkQr:'二维码',linkConvert:'转换格式'},
  en:{title:'Barcode generator',subtitle:'Generate CODE128, EAN, and other barcodes as PNG.',privacy:'Local · no upload',format:'Format',textLabel:'Content',height:'Height',width:'Bar width',margin:'Margin',showText:'Show text',fg:'Foreground',bg:'Background',download:'Download PNG',clear:'Clear',emptyTitle:'Enter content to make a barcode',waiting:'Waiting for text',ready:'{fmt} · {w}×{h}',ph128:'imagec',phEan13:'6901234567892',phEan8:'96385074',phUpc:'036000291452',ph39:'IMAGEC',hint128:'Digits, letters, and common symbols.',hintEan13:'13 digits. The last digit is the checksum.',hintEan8:'8 digits. The last digit is the checksum.',hintUpc:'12 digits. The last digit is the checksum.',hint39:'Digits, uppercase letters, and - . space $ / + %.',errEan13:'EAN-13 needs 13 digits, and the last digit must be a valid checksum.',errEan8:'EAN-8 needs 8 digits, and the last digit must be a valid checksum.',errUpc:'UPC needs 12 digits, and the last digit must be a valid checksum.',errCode39:'CODE39 only allows digits, uppercase letters, and - . space $ / + %.',errInvalid:'That content cannot be encoded in this format.',errLib:'The barcode library failed to load. Check the network, allow jsDelivr, and refresh.',moreTools:'More image tools',linkQr:'QR code',linkConvert:'Convert a format'}
};
const HINT={CODE128:'hint128',EAN13:'hintEan13',EAN8:'hintEan8',UPC:'hintUpc',CODE39:'hint39'};
const PLACE={CODE128:'ph128',EAN13:'phEan13',EAN8:'phEan8',UPC:'phUpc',CODE39:'ph39'};
let language=detectLang();
let fmt='CODE128';
let renderSeq=0;
const langSelect=$('#langSelect');
LANGS.forEach(l=>{
  const opt=document.createElement('option');
  opt.value=l.code;
  opt.textContent=l.name;
  langSelect.appendChild(opt);
});
function knownLang(code){return LANGS.some(l=>l.code===code);}
function detectLang(){
  const param=new URL(location.href).searchParams.get('lang');
  if(param&&knownLang(param))return param;
  let saved='';
  try{saved=localStorage.getItem('language')||'';}catch(e){}
  if(saved&&knownLang(saved))return saved;
  const navLangs=navigator.languages||[navigator.language||'zh'];
  for(const l of navLangs){
    const lc=String(l).toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    const code=lc.slice(0,2);
    if(knownLang(code))return code;
  }
  return 'zh';
}
function t(key){
  const pack=messages[language];
  if(pack&&pack[key]!=null)return pack[key];
  if(messages.en&&messages.en[key]!=null)return messages.en[key];
  if(messages.zh&&messages.zh[key]!=null)return messages.zh[key];
  return key;
}
function tf(key,map){
  let s=t(key);
  Object.keys(map||{}).forEach(k=>{s=s.replaceAll('{'+k+'}',String(map[k]));});
  return s;
}
function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}
function clamp(id,min,max,fallback){
  const n=parseInt($(id).value,10);
  if(!Number.isFinite(n))return fallback;
  return Math.min(max,Math.max(min,n));
}
function syncNums(){
  $('#heightV').textContent=String(clamp('#height',40,180,100));
  $('#barWidthV').textContent=String(clamp('#barWidth',1,4,2));
  $('#marginV').textContent=String(clamp('#margin',0,20,10));
  $('#fgHex').textContent=$('#fg').value.toUpperCase();
  $('#bgHex').textContent=$('#bg').value.toUpperCase();
}
function syncFmt(){
  $('#fmtSeg').querySelectorAll('button').forEach(btn=>{
    btn.classList.toggle('active',btn.getAttribute('data-fmt')===fmt);
  });
  $('#fmtHint').textContent=t(HINT[fmt]||'hint128');
  $('#text').placeholder=t(PLACE[fmt]||'ph128');
}
function applyI18n(){
  const def=LANGS.find(l=>l.code===language)||LANGS[0];
  document.documentElement.lang=language==='zh'?'zh-CN':language;
  document.documentElement.dir=def.dir;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    const value=t(key);
    if(value!==key)el.innerHTML=value;
  });
  syncNums();
  syncFmt();
  const seo=SEO[language]||SEO.en||SEO.zh;
  document.title=seo.title;
  setMeta('name','description',seo.desc);
  setMeta('property','og:title',seo.title);
  setMeta('property','og:description',seo.desc);
  setMeta('name','twitter:title',seo.title);
  setMeta('name','twitter:description',seo.desc);
  const ld=document.querySelector('#ldjson');
  if(ld){
    try{
      const obj=JSON.parse(ld.textContent);
      obj.name=t('title');
      obj.description=seo.desc;
      ld.textContent=JSON.stringify(obj);
    }catch(e){}
  }
  const banner=$('#libStatus');
  if(banner&&!banner.hidden&&banner.dataset.key)banner.textContent=t(banner.dataset.key);
  const err=$('#codeError');
  if(err&&!err.hidden&&err.dataset.key)err.textContent=t(err.dataset.key);
}
function setLanguage(lang){
  if(!knownLang(lang))lang='en';
  language=lang;
  try{localStorage.setItem('language',lang);}catch(e){}
  langSelect.value=language;
  applyI18n();
  render();
}
function showBanner(key){
  const el=$('#libStatus');
  if(!el)return;
  if(!key){el.hidden=true;el.textContent='';delete el.dataset.key;return;}
  el.dataset.key=key;
  el.hidden=false;
  el.textContent=t(key);
}
function checksumOk(code){
  if(!/^\d+$/.test(code)||code.length<2)return false;
  const digits=code.split('').map(n=>parseInt(n,10));
  const check=digits.pop();
  let sum=0;
  for(let i=0;i<digits.length;i++){
    const fromRight=digits.length-1-i;
    sum+=digits[i]*(fromRight%2===0?3:1);
  }
  return (10-(sum%10))%10===check;
}
function validate(format,raw){
  const text=format==='CODE39'?raw.toUpperCase():raw;
  if(format==='EAN13')return /^\d{13}$/.test(text)&&checksumOk(text)?'':'errEan13';
  if(format==='EAN8')return /^\d{8}$/.test(text)&&checksumOk(text)?'':'errEan8';
  if(format==='UPC')return /^\d{12}$/.test(text)&&checksumOk(text)?'':'errUpc';
  if(format==='CODE39')return /^[0-9A-Z\-. $/+%]+$/.test(text)?'':'errCode39';
  if(!text)return 'errInvalid';
  return '';
}
function showEmpty(){
  $('#empty').style.display='';
  $('#wrap').style.display='';
  $('#barcode').style.display='none';
  $('#codeError').hidden=true;
  delete $('#codeError').dataset.key;
  $('#download').disabled=true;
  $('#clear').disabled=!$('#text').value;
  $('#meta').textContent=t('waiting');
}
function showError(key){
  $('#empty').style.display='none';
  $('#wrap').style.display='none';
  $('#barcode').style.display='none';
  $('#codeError').hidden=false;
  $('#codeError').dataset.key=key;
  $('#codeError').textContent=t(key);
  $('#meta').textContent=t(key);
  $('#download').disabled=true;
  $('#clear').disabled=!$('#text').value;
}
function showReady(){
  const canvas=$('#barcode');
  $('#empty').style.display='none';
  $('#wrap').style.display='';
  $('#codeError').hidden=true;
  delete $('#codeError').dataset.key;
  canvas.style.display='block';
  $('#download').disabled=false;
  $('#clear').disabled=false;
  $('#meta').textContent=tf('ready',{fmt:fmt,w:canvas.width,h:canvas.height});
  showBanner('');
}
function render(){
  const seq=++renderSeq;
  const raw=$('#text').value.trim();
  if(!raw){showEmpty();return;}
  const key=validate(fmt,raw);
  if(key){showError(key);return;}
  if(typeof JsBarcode!=='function'){showError('errLib');showBanner('errLib');return;}
  const value=fmt==='CODE39'?raw.toUpperCase():raw;
  $('#clear').disabled=false;
  try{
    JsBarcode('#barcode',value,{
      format:fmt,
      width:clamp('#barWidth',1,4,2),
      height:clamp('#height',40,180,100),
      margin:clamp('#margin',0,20,10),
      displayValue:$('#showText').checked,
      lineColor:$('#fg').value,
      background:$('#bg').value
    });
    if(seq!==renderSeq)return;
    showReady();
  }catch(e){
    if(seq!==renderSeq)return;
    showError('errInvalid');
  }
}
function schedule(){
  clearTimeout(schedule.timer);
  schedule.timer=setTimeout(render,40);
}
$('#text').addEventListener('input',schedule);
$('#height').addEventListener('input',()=>{syncNums();render();});
$('#barWidth').addEventListener('input',()=>{syncNums();render();});
$('#margin').addEventListener('input',()=>{syncNums();render();});
$('#showText').addEventListener('change',render);
$('#fg').addEventListener('input',()=>{syncNums();render();});
$('#bg').addEventListener('input',()=>{syncNums();render();});
$('#fmtSeg').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-fmt]');
  if(!btn)return;
  fmt=btn.getAttribute('data-fmt');
  syncFmt();
  render();
});
$('#clear').addEventListener('click',()=>{
  $('#text').value='';
  render();
  $('#text').focus();
});
$('#download').addEventListener('click',()=>{
  const canvas=$('#barcode');
  if($('#download').disabled||!canvas.width)return;
  canvas.toBlob(blob=>{
    if(!blob)return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='imagec-'+fmt.toLowerCase()+'.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  },'image/png');
});
langSelect.addEventListener('change',()=>setLanguage(langSelect.value));
if(window.ensureJsBarcode){window.ensureJsBarcode().then(function(fn){if(!fn)showBanner('errLib');});}else if(typeof JsBarcode!=='function')showBanner('errLib');
setLanguage(language);
(function watchCards(){
  const grid=document.querySelector('[data-tool-cards]');
  if(!grid)return;
  const fix=()=>{
    grid.querySelectorAll('[data-i18n]').forEach(el=>{
      const key=el.getAttribute('data-i18n');
      const value=t(key);
      if(value!==key&&el.textContent!==value)el.textContent=value;
    });
  };
  new MutationObserver(fix).observe(grid,{childList:true,subtree:true});
})();
document.addEventListener('DOMContentLoaded',()=>{applyI18n();render();});
