};
let language=detectLang();

let seq=0;

let sourceBytes=null;

const langSelect=$('#langSelect');
LANGS.forEach(l=>{
  const opt=document.createElement('option');
  opt.value=l.code;
  opt.textContent=l.name;
  langSelect.appendChild(opt);
});
function knownLang(code){return LANGS.some(l=>l.code===code);}
function detectLang(){
  const param=new URL(location.href).searchParams.get('lang');
  if(param&&knownLang(param))return param;
  let saved='';
  try{saved=localStorage.getItem('language')||'';}catch(e){}
  if(saved&&knownLang(saved))return saved;
  const navLangs=navigator.languages||[navigator.language||'zh'];
  for(const l of navLangs){
    const lc=String(l).toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    const code=lc.slice(0,2);
    if(knownLang(code))return code;
  }
  return 'zh';
}
function t(key){
  const pack=messages[language];
  if(pack&&pack[key]!=null)return pack[key];
  if(messages.en&&messages.en[key]!=null)return messages.en[key];
  if(messages.zh&&messages.zh[key]!=null)return messages.zh[key];
  return key;
}
function tf(key,map){
  let s=t(key);
  Object.keys(map||{}).forEach(k=>{s=s.replaceAll('{'+k+'}',String(map[k]));});
  return s;
}
function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}
function applyI18n(){
  const def=LANGS.find(l=>l.code===language)||LANGS[0];
  document.documentElement.lang=language==='zh'?'zh-CN':language;
  document.documentElement.dir=def.dir;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    const value=t(key);
    if(value!==key)el.innerHTML=value;
  });
  syncScaleLabel();
  $('#qualityV').textContent=$('#quality').value;
  const seo=SEO[language]||SEO.en||SEO.zh;
  document.title=seo.title;
  setMeta('name','description',seo.desc);
  setMeta('property','og:title',seo.title);
  setMeta('property','og:description',seo.desc);
  setMeta('name','twitter:title',seo.title);
  setMeta('name','twitter:description',seo.desc);
  const ld=document.querySelector('#ldjson');
  if(ld){
    try{
      const obj=JSON.parse(ld.textContent);
      obj.name=t('title');
      obj.description=seo.desc;
      ld.textContent=JSON.stringify(obj);
    }catch(e){}
  }
  const banner=$('#libStatus');
  if(banner&&!banner.hidden&&banner.dataset.key)banner.textContent=t(banner.dataset.key);
  onLang();
}
function setLanguage(lang){
  if(!knownLang(lang))lang='en';
  language=lang;
  try{localStorage.setItem('language',lang);}catch(e){}
  langSelect.value=language;
  applyI18n();
}
function showBanner(key){
  const el=$('#libStatus');
  if(!el)return;
  if(!key){el.hidden=true;el.textContent='';delete el.dataset.key;return;}
  el.dataset.key=key;
  el.hidden=false;
  el.textContent=t(key);
}
function syncFmt(){
  $('#fmtSeg').querySelectorAll('button').forEach(btn=>{
    btn.classList.toggle('active',btn.getAttribute('data-fmt')===fmt);
  });
  $('#qualityGroup').style.display=fmt==='jpeg'?'':'none';
}
function scaleValue(){
  const n=parseFloat($('#scale').value);
  if(!Number.isFinite(n))return 2;
  return Math.min(3,Math.max(1,n));
}
function syncScaleLabel(){
  const s=scaleValue();
  $('#scaleV').textContent=s+' · '+Math.round(s*72)+' DPI';
}
function extOf(){return fmt==='jpeg'?'jpg':'png';}
function pageFile(i){return 'page-'+String(i+1).padStart(2,'0')+'.'+extOf();}
function paintMeta(){
  const meta=$('#meta');
  if(!meta)return;
  if(busy){meta.textContent=t('working');return;}
  if(pages.length){
    const canvas=pages[selected];
    meta.textContent=tf('ready',{n:selected+1,total:pages.length,w:canvas.width,h:canvas.height});
    return;
  }
  meta.textContent=t('waiting');
}
function onLang(){
  labelRows();
  paintMeta();
}
function showEmpty(){
  pages=[];
  selected=0;
  sourceBytes=null;
  busy=false;
  $('#queue').innerHTML='';
  const canvas=$('#canvas');
  canvas.width=0;
  canvas.height=0;
  canvas.style.display='none';
  $('#empty').style.display='';
  $('#download').disabled=true;
  $('#zipBtn').disabled=true;
  $('#clear').disabled=true;
  $('#file').value='';
  document.body.classList.remove('computing');
  paintMeta();
}
function showPage(){
  const src=pages[selected];
  if(!src)return;
  const canvas=$('#canvas');
  canvas.width=src.width;
  canvas.height=src.height;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(src,0,0);
  canvas.style.display='block';
  $('#empty').style.display='none';
  paintMeta();

function markSelected(){
  $('#queue').querySelectorAll('.qItem').forEach((el,i)=>el.classList.toggle('on',i===selected));
}
function labelRows(){
  $('#queue').querySelectorAll('.qItem').forEach((row,i)=>{
    const name=row.querySelector('.qName');
    const dl=row.querySelector('[data-act="dl"]');
    if(name)name.textContent=tf('pageName',{n:i+1});
    if(dl)dl.textContent=t('dlPage');
  });
}
function makeThumb(src){
  const max=96;
  const scale=Math.min(1,max/src.width,max/src.height);
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(src.width*scale));
  c.height=Math.max(1,Math.round(src.height*scale));
  const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.8);
}
function addRow(i,canvas){
  const row=document.createElement('article');

  row.querySelector('.qThumb').src=makeThumb(canvas);
  row.querySelector('.qName').textContent=tf('pageName',{n:i+1});
  row.querySelector('.qStatus').textContent=canvas.width+' × '+canvas.height;
  const dl=row.querySelector('[data-act="dl"]');
  dl.textContent=t('dlPage');

}
function pdfLib(mod){
  if(mod&&typeof mod.getDocument==='function')return mod;
  if(mod&&mod.default&&typeof mod.default.getDocument==='function')return mod.default;
  return null;
}
let pdfPromise=null;
function ensurePdf(){
  if(!pdfPromise){
    pdfPromise=(async()=>{
      let lastErr=null;
      for(const pack of PDF_FALLBACKS){
        try{
          PDF_URL=pack.url; PDF_WORKER=pack.worker; PDF_CMAP=pack.cmap; PDF_FONTS=pack.fonts;
          const mod=await import(PDF_URL);
          const lib=pdfLib(mod);
          if(!lib)throw new Error('lib');
          lib.GlobalWorkerOptions.workerSrc=PDF_WORKER;
          return lib;
        }catch(e){ lastErr=e; }
      }
      throw lastErr||new Error('lib');
    })().catch(err=>{pdfPromise=null;throw err;});
  }
  return pdfPromise;
}
function failKey(err){
  const name=err&&(err.name||'');
  const msg=String(err&&err.message||err||'');
  if(name==='PasswordException'||/password/i.test(msg))return 'errLoad';
  if(msg==='big')return 'errBig';
  if(msg==='pages')return 'errPages';
  if(msg==='lib'||/failed to fetch|load/i.test(msg))return 'errLib';
  return 'errLoad';
}
async function renderPdf(id){
  const lib=await ensurePdf();
  if(id!==seq)return;
  if(pdfTask){try{await pdfTask.destroy();}catch(e){}}
  pdfTask=lib.getDocument({
    data:sourceBytes.slice(0),
    cMapUrl:PDF_CMAP,
    cMapPacked:true,
    standardFontDataUrl:PDF_FONTS
  });
  const pdf=await pdfTask.promise;
  if(id!==seq){try{pdf.destroy();}catch(e){}return;}
  if(pdf.numPages>MAX_PAGES){try{pdf.destroy();}catch(e){}throw new Error('pages');}
  const scale=scaleValue();
  $('#queue').innerHTML='';
  pages=[];
  selected=0;
  for(let n=1;n<=pdf.numPages;n++){
    if(id!==seq){try{pdf.destroy();}catch(e){}return;}
    $('#meta').textContent=tf('rendering',{n:n,total:pdf.numPages});
    const page=await pdf.getPage(n);
    const viewport=page.getViewport({scale});
    const w=Math.max(1,Math.floor(viewport.width));
    const h=Math.max(1,Math.floor(viewport.height));
    if(w>MAX_EDGE||h>MAX_EDGE){try{pdf.destroy();}catch(e){}throw new Error('big');}
    const canvas=document.createElement('canvas');
    canvas.width=w;
    canvas.height=h;
    const ctx=canvas.getContext('2d',{alpha:false});
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,w,h);
    await page.render({canvasContext:ctx,viewport}).promise;
    try{page.cleanup();}catch(e){}
    pages.push(canvas);
    if(pages.length===1)showPage();
    addRow(pages.length-1,canvas);
    $('#download').disabled=false;
    $('#zipBtn').disabled=false;
    $('#clear').disabled=false;
  }
  try{pdf.destroy();}catch(e){}
  pdfTask=null;
}
async function load(file){
  if(!file)return;
  const name=(file.name||'').toLowerCase();
  const type=(file.type||'').toLowerCase();
  if(type!=='application/pdf'&&type!=='application/x-pdf'&&!name.endsWith('.pdf')){showBanner('errType');return;}
  const id=++seq;
  showBanner('');
  busy=true;
  pages=[];
  $('#queue').innerHTML='';
  $('#canvas').style.display='none';
  $('#empty').style.display='none';
  $('#download').disabled=true;
  $('#zipBtn').disabled=true;
  $('#clear').disabled=false;
  $('#wrap').dataset.loading=t('working');
  document.body.classList.add('computing');
  paintMeta();
  try{
    baseName=(file.name||'document').replace(/\.[^.]+$/,'')||'document';
    sourceBytes=new Uint8Array(await file.arrayBuffer());
    if(id!==seq)return;
    await renderPdf(id);
    if(id!==seq)return;
    if(!pages.length){showEmpty();showBanner('errLoad');return;}
    busy=false;
    document.body.classList.remove('computing');
    showPage();
    showBanner('');
  }catch(e){
    if(id!==seq)return;
    busy=false;
    document.body.classList.remove('computing');
    const key=failKey(e);
    if(!pages.length&&key!=='errBig')showEmpty();
    else if(!pages.length){
      $('#canvas').style.display='none';
      $('#empty').style.display='none';
      $('#clear').disabled=false;
      paintMeta();
    }
    showBanner(key);
  }
}
function canvasBlob(canvas){
  const mime=fmt==='jpeg'?'image/jpeg':'image/png';
  const q=(parseInt($('#quality').value,10)||85)/100;
  let target=canvas;
  if(mime==='image/jpeg'){
    const off=document.createElement('canvas');
    off.width=canvas.width;
    off.height=canvas.height;
    const o=off.getContext('2d');
    o.fillStyle='#ffffff';
    o.fillRect(0,0,off.width,off.height);
    o.drawImage(canvas,0,0);
    target=off;
  }
  return new Promise(resolve=>{
    try{target.toBlob(blob=>resolve(blob),mime,mime==='image/png'?undefined:q);}
    catch(e){resolve(null);}
  });
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function downloadPage(i){
  const canvas=pages[i];
  if(!canvas)return;
  const blob=await canvasBlob(canvas);
  if(!blob){showBanner('errExport');return;}
  showBanner('');
  downloadBlob(blob,baseName+'-'+pageFile(i));
}
const CRC_TABLE=(()=>{
  const table=new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c=n;
    for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
    table[n]=c>>>0;
  }
  return table;
})();
function crc32(data){
  let c=0xFFFFFFFF;
  for(let i=0;i<data.length;i++)c=CRC_TABLE[(c^data[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function buildZip(files){
  const now=new Date();
  let year=now.getFullYear();
  if(year<1980)year=1980;
  const time=(now.getHours()<<11)|(now.getMinutes()<<5)|Math.floor(now.getSeconds()/2);
  const date=((year-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  const encoder=new TextEncoder();
  const parts=[];
  const central=[];
  let offset=0;
  files.forEach(file=>{
    const name=encoder.encode(file.name);
    const local=new Uint8Array(30+name.length);
    const view=new DataView(local.buffer);
    view.setUint32(0,0x04034b50,true);
    view.setUint16(4,20,true);
    view.setUint16(6,0x0800,true);
    view.setUint16(10,time,true);
    view.setUint16(12,date,true);
    view.setUint32(14,file.crc,true);
    view.setUint32(18,file.data.length,true);
    view.setUint32(22,file.data.length,true);
    view.setUint16(26,name.length,true);
    local.set(name,30);
    parts.push(local,file.data);
    const cd=new Uint8Array(46+name.length);
    const cdView=new DataView(cd.buffer);
    cdView.setUint32(0,0x02014b50,true);
    cdView.setUint16(4,20,true);
    cdView.setUint16(6,20,true);
    cdView.setUint16(8,0x0800,true);
    cdView.setUint16(12,time,true);
    cdView.setUint16(14,date,true);
    cdView.setUint32(16,file.crc,true);
    cdView.setUint32(20,file.data.length,true);
    cdView.setUint32(24,file.data.length,true);
    cdView.setUint16(28,name.length,true);
    cdView.setUint32(42,offset,true);
    cd.set(name,46);
    central.push(cd);
    offset+=local.length+file.data.length;
  });
  const cdSize=central.reduce((sum,part)=>sum+part.length,0);
  const end=new Uint8Array(22);
  const endView=new DataView(end.buffer);
  endView.setUint32(0,0x06054b50,true);
  endView.setUint16(8,files.length,true);
  endView.setUint16(10,files.length,true);
  endView.setUint32(12,cdSize,true);
  endView.setUint32(16,offset,true);
  const blobParts=parts.concat(central,[end]);
  const total=blobParts.reduce((sum,part)=>sum+part.length,0);
  const out=new Uint8Array(total);
  let cursor=0;
  blobParts.forEach(part=>{out.set(part,cursor);cursor+=part.length;});
  return out;
}
async function downloadZip(){
  if(!pages.length||$('#zipBtn').disabled)return;
  $('#zipBtn').disabled=true;
  $('#download').disabled=true;
  try{
    const files=[];
    for(let i=0;i<pages.length;i++){
      const blob=await canvasBlob(pages[i]);
      if(!blob){showBanner('errExport');return;}
      const data=new Uint8Array(await blob.arrayBuffer());
      files.push({name:pageFile(i),data,crc:crc32(data)});
    }
    downloadBlob(new Blob([buildZip(files)],{type:'application/zip'}),baseName+'-pages.zip');
    showBanner('');
  }finally{
    $('#zipBtn').disabled=!pages.length;
    $('#download').disabled=!pages.length;
  }
}
function bindDrop(){
  const drop=$('#drop');
  ['dragenter','dragover'].forEach(type=>{
    drop.addEventListener(type,ev=>{ev.preventDefault();drop.classList.add('over');});
  });
  ['dragleave','drop'].forEach(type=>{
    drop.addEventListener(type,ev=>{ev.preventDefault();drop.classList.remove('over');});
  });
  drop.addEventListener('drop',e=>{
    const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(file)load(file);
  });
}
$('#file').addEventListener('change',e=>{
  if(e.target.files&&e.target.files[0])load(e.target.files[0]);
});
bindDrop();
document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(const item of items){
    if(item.kind==='file'){
      const file=item.getAsFile();
      if(file){load(file);break;}
    }
  }
});

  const id=++seq;
  busy=true;
  $('#download').disabled=true;
  $('#zipBtn').disabled=true;
  $('#wrap').dataset.loading=t('working');
  document.body.classList.add('computing');
  paintMeta();
  try{
    await renderPdf(id);
    if(id!==seq)return;
    busy=false;
    document.body.classList.remove('computing');
    if(selected>=pages.length)selected=0;
    showPage();
    showBanner('');
  }catch(e){
    if(id!==seq)return;

    if(!pages.length){
      $('#canvas').style.display='none';
      $('#download').disabled=true;

      if(selected>=pages.length)selected=0;
      showPage();
      $('#download').disabled=false;

    paintMeta();
  }
}
